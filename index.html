  let h = 5381; for (const ch of path.toLowerCase()) h = (h * 33 ^ ch.charCodeAt(0)) >>> 0;
  return 'f-' + h.toString(16);
}
// Programa la copia de recuperación: tras N s sin escribir, pero como mucho cada M s escribiendo seguido.
function backupSoon(path) {
  const now = Date.now(), b = backupTimers.get(path) || { first: now };
  clearTimeout(b.t);
  const wait = Math.min((AJ.recup_espera_seg || 2) * 1000, Math.max(0, b.first + (AJ.recup_max_seg || 10) * 1000 - now));
  b.t = setTimeout(() => backupNow(path), wait);
  backupTimers.set(path, b);
}
function backupBody(path) {
  const ed = edits.get(path);
  return ed && { clave: recKey(path), ruta: isUntitled(path) ? null : path, titulo: ed.f.nombre, texto: ed.text,
    mtime: ed.f.mtime, codificacion: ed.f.codificacion, eol: ed.f.eol };
}
// Copia de recuperación ya; sin cambios, se borra. keepalive: también si la ventana se está cerrando.
function backupNow(path, keepalive = false) {
  clearTimeout(backupTimers.get(path)?.t); backupTimers.delete(path);
  const ed = edits.get(path);
  if (!ed || (!isDirty(ed) && !isUntitled(path))) return dropBackup(path);
  return fetch('/api/recup/guardar', { method: 'POST', keepalive, headers: { ...H, 'Content-Type': 'application/json' },
    body: JSON.stringify(backupBody(path)) }).catch(() => {});
}
function dropBackup(path) {
  clearTimeout(backupTimers.get(path)?.t); backupTimers.delete(path);
  api('/api/recup/borrar', { clave: recKey(path) }).catch(() => {});
}
// Al cerrar la ventana: copia ya lo pendiente; true si había algo, para que el navegador pregunte antes de cerrar.
function flushBackups() {
  const pending = [...backupTimers.keys()];
  pending.forEach(p => backupNow(p, true));
  return pending.length > 0;
}
const untitledFile = n => ({ nombre: 'nuevo ' + n, ruta: 'nuevo:' + n, texto: '', codificacion: 'utf-8', eol: 'CRLF',
  mtime: null, tam: 0, fecha: Date.now() / 1000, truncado: false, ejecutar: null });
// Pestaña «nuevo N» sin archivo en disco (Ctrl+N), con el primer número libre.
function newUntitled(texto = '') {
  const used = tabs.filter(isUntitled).map(p => +p.slice(6));
  let n = 1; while (used.includes(n)) n++;
  const path = 'nuevo:' + n;
  edits.set(path, { f: untitledFile(n), text: texto, orig: '', shown: !!texto });
  openTab(path, true);
  backupNow(path);
  return path;
}

// Al abrir DeskLens: reabre lo que no se llegó a guardar
async function recoverAll() {
  const list = await api('/api/recup').catch(() => []), found = [];
  for (const e of list) {
    if (!e.ruta) { // "nuevo N"
      const n = e.clave.slice(6), path = 'nuevo:' + n;
      edits.set(path, { f: untitledFile(n), text: e.texto || '', orig: '', shown: !!e.texto });
      if (!tabs.includes(path)) tabs.push(path);
      if (e.texto) found.push(`nuevo ${n}`);
      continue;
    }
    let f = null;
    try { f = await api('/api/abrir?ruta=' + encodeURIComponent(e.ruta)); } catch {}
    const name = e.ruta.split(/[\\/]/).pop(), ago = new Date(e.fecha * 1000).toLocaleString();
    if (!f) { // el archivo ya no existe: el texto se recupera como "nuevo N"
      dropBackup(e.ruta); newUntitled(e.texto); found.push(`${name} (ya no existía: abierto como nuevo)`); continue;
    }
    if (String(f.mtime) === String(e.mtime)) {
      edits.set(e.ruta, { f, text: e.texto, orig: norm(f.texto || ''), shown: true });
      if (!tabs.includes(e.ruta)) tabs.push(e.ruta);
      found.push(`${name} · copia del ${ago}`);
      continue;
    }
    // cambió en disco desde la copia: se elige, nunca se mezcla
    const c = await ask('Recuperación con conflicto', `${name} cambió en disco después de la copia del ${ago}.`,
      ['Usar mi versión recuperada', 'Usar la del disco', 'Ver las dos']);
    if (c === 'Usar mi versión recuperada') {
      edits.set(e.ruta, { f, text: e.texto, orig: norm(f.texto || ''), shown: true });
      if (!tabs.includes(e.ruta)) tabs.push(e.ruta);
      found.push(`${name} · versión recuperada`);
    } else if (c === 'Ver las dos') {
      if (!tabs.includes(e.ruta)) tabs.push(e.ruta);
      dropBackup(e.ruta); newUntitled(e.texto); found.push(`${name} · versión recuperada en una pestaña nueva`);
    } else dropBackup(e.ruta);
  }
  if (found.length && (!cur || !tabs.includes(cur))) cur = tabs.find(p => edits.has(p)) || cur; // se ve lo recuperado
  persist();
  const n = found.length;
  if (n) ask('Recuperación', `${n === 1 ? 'Se recuperó 1 archivo' : `Se recuperaron ${n} archivos`} con cambios sin guardar:\n\n• ${found.join('\n• ')}`, ['Entendido']);
}

function flash(text) {
  const m = $('#msg'); if (!m) return;
  m.textContent = text; m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); // destello para que se vea
  setTimeout(() => m.textContent === text && (m.textContent = ''), 5000);
}
// Modal centrado para avisos y preguntas (en lugar de alert/confirm/prompt; ver reglas.md).
// Va en su propio <dialog>, encima de cualquier otro. Devuelve el botón pulsado, o null con Esc.
// { danger }: el primer botón borra o descarta (rojo) · { input: 'valor' }: pide un texto y devuelve ese texto (o null)
const modalOpen = () => !!document.querySelector('dialog[open]');
// numeric: el cuadro solo admite dígitos (lo demás se borra al escribirlo o pegarlo).
function ask(title, msg, buttons, { danger, input, numeric } = {}) {
  const d = $('#ask');
  d.innerHTML = '<b></b><p></p>' + (input !== undefined ? '<input spellcheck="false">' : '') + '<div class="exp-actions"></div>';
  d.querySelector('b').textContent = title; d.querySelector('p').textContent = msg;
  const inp = d.querySelector('input'), acts = d.lastChild;
  return new Promise(res => {
    let done = false;
    const end = t => { if (done) return; done = true; d.close(); res(inp ? (t === buttons[0] ? inp.value : null) : t); };
    buttons.forEach((t, i) => acts.append(Object.assign(button(t, () => end(t)), { className: i ? '' : danger ? 'primary danger' : 'primary' })));
    d.oncancel = d.onclose = () => end(null); // Esc
    d.showModal();
    if (inp) {
      // con llaves: un on… que devuelve false anula la tecla (con «e.key === 'Enter' && …» no se podía escribir nada)
      inp.value = input; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); end(buttons[0]); } }; inp.focus(); inp.select();
      if (numeric) { inp.inputMode = 'numeric'; inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ''); }; }
      // si algo le quita el foco al cuadro, lo que se escribe vuelve a él (y no se pierde)
      d.onkeydown = e => { if (e.target !== inp && e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) inp.focus(); };
    } else {
      d.onkeydown = null;
      acts.querySelector(danger ? 'button:not(.primary)' : '.primary')?.focus(); // borrar nunca queda a un Enter de distancia
    }
  });
}

// Guarda el texto en el archivo conservando codificación y saltos de línea. Si cambió fuera de DeskLens
// desde que se abrió (409), pregunta qué versión conservar. Marca el paso del historial como guardado.
async function save(path, force = false) {
  const ed = edits.get(path); if (!ed) return;
  if (isUntitled(path)) return saveUntitled(path);
  await hists.get(path)?.flush?.(); // lo último escrito entra en el historial antes de guardar
  const r = await fetch('/api/guardar', { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
    body: JSON.stringify({ ruta: path, texto: ed.text, codificacion: ed.f.codificacion, eol: ed.f.eol, mtime: ed.f.mtime, forzar: force }) });
  const d = await r.json();
  if (r.status === 409) {
    const c = await ask('Conflicto', `"${ed.f.nombre}" cambió fuera de DeskLens a las ${new Date(d.fecha * 1000).toLocaleTimeString()}. ` +
      '¿Qué versión quieres conservar?', ['Recargar su versión', 'Sobrescribir', 'Cancelar']);
    if (c === 'Sobrescribir') return save(path, true);
    if (c === 'Recargar su versión') startEdit(path, await api('/api/abrir?ruta=' + encodeURIComponent(path)));
    return;
  }
  if (!r.ok) return ask('No se guardó', d.error, ['Entendido']);
  ed.f.mtime = d.mtime; ed.orig = ed.text; ed.shown = false;
  if (ed.text === ed.histLast) histSaved(path); // 💾 en el historial
  dropBackup(path); // guardado: la copia de recuperación ya no hace falta
  renderTabs();
  flash('✓ Guardado' + (d.bak ? ' · respaldo: ' + d.bak.split(/[\\/]/).pop() : ''));
}
// ---------- el archivo abierto cambió en el disco (otro programa, la IA, git…): se recarga solo o se pregunta ----------
// ⚙ «Preguntar antes de recargar…» (predeterminado: no). Con cambios sin guardar aquí, siempre se pregunta.
const diskSkip = new Map(); // ruta → mtime que el usuario decidió no recargar (no se vuelve a preguntar por ese mismo cambio)
// Cada pocos segundos: si el archivo abierto cambió en disco (otro programa, la IA, git), lo recarga o avisa si hay cambios sin guardar.
async function diskPoll() {
  try {
    const path = cur, f = curFile;
    if (!path || !f?.mtime || isUntitled(path) || document.hidden || modalOpen()) return;
    const r = await api('/api/mtime?ruta=' + encodeURIComponent(path));
    const known = edits.get(path)?.f?.mtime || f.mtime;
    if (path !== cur || !r.mtime || r.mtime === known || diskSkip.get(path) === r.mtime) return;
    const ed = edits.get(path), st = [wedit, iedit, pedit].find(s => s?.path === path);
    const dirty = (ed && isDirty(ed)) || st?.dirty, name = path.split(/[\\/]/).pop();
    if (dirty || AJ.recargar_preguntar) {
      const ok = dirty ? 'Recargar (perder mis cambios)' : 'Recargar';
      const t = await ask('Cambió en el disco', dirty
        ? `«${name}» cambió fuera de DeskLens y aquí tienes cambios sin guardar.\nSi lo recargas, esos cambios se pierden.`
        : `«${name}» cambió fuera de DeskLens. ¿Recargarlo?`, dirty ? ['Mantener mis cambios', ok] : [ok, 'Ahora no']);
      if (t !== ok) { diskSkip.set(path, r.mtime); return; }
    }
    await reloadFromDisk(path);
  } catch {} finally { setTimeout(diskPoll, 3000); }
}
// Recarga el archivo abierto conservando el scroll (y, en edición, el cursor) sin salir de lo que se estaba haciendo.
async function reloadFromDisk(path) {
  const V = $('#view'), top = V.scrollTop, ed = edits.get(path), name = path.split(/[\\/]/).pop();
  let cm = null;
  if (ed) { // en edición: el texto nuevo, sin salir de edición
    const f = await api('/api/abrir?ruta=' + encodeURIComponent(path));
    if (editorCM && cur === path) cm = { c: editorCM.getCursor(), s: editorCM.getScrollInfo() };
    if (f.texto === null || f.truncado) edits.delete(path);
    else { const t = norm(f.texto); Object.assign(ed, { f, text: t, orig: t, histLast: t, shown: false }); dropBackup(path); }
  }
  const st = [wedit, iedit, pedit].find(s => s?.path === path);
  if (st) endEdit(st); // Word, imagen o PDF en edición (sin cambios): se vuelve a la vista con lo nuevo
  textCache.delete(path); diskSkip.delete(path);
  await render();
  setTimeout(() => { // donde estabas: cursor y scroll en el editor, scroll en lectura (el PDF recuerda su página solo)
    if (cur !== path) return;
    if (cm && editorCM) { editorCM.setCursor(cm.c); editorCM.scrollTo(cm.s.left, cm.s.top); } else V.scrollTop = top;
  }, 150);
  flash(`↻ «${name}» se actualizó desde el disco`);
}
setTimeout(diskPoll, 3000);

// Descartar cambios: vuelve al texto guardado y el historial al paso del archivo en disco.
async function discard(path) {
  const ed = edits.get(path);
  if (isDirty(ed) && await ask('Descartar cambios', `¿Volver a la última versión guardada de "${ed.f.nombre}"?`, ['Descartar', 'Cancelar']) !== 'Descartar') return;
  ed.text = ed.histLast = ed.orig; ed.shown = false; dropBackup(path);
  const h = hists.get(path); if (h) { clearTimeout(ed.histT); h.actual = h.disco; } // de vuelta al archivo en disco
  render();
}
// Sale de edición (📖) preguntando si hay cambios; un «nuevo N» solo sale guardándolo.
async function leaveEdit(path) {
  const ed = edits.get(path);
  if (isUntitled(path)) return save(path); // un "nuevo N" solo sale de edición guardándolo
  if (!await askUnsaved(path)) return;
  dropBackup(path); edits.delete(path); preview = false; render();
}
function frame(src) {
  // sandbox sin allow-same-origin: un HTML del usuario no puede tocar DeskLens
  const f = document.createElement('iframe'); f.className = 'full'; f.src = src;
  if (!/\.pdf(#|$)/i.test(src)) f.sandbox = 'allow-scripts allow-forms allow-modals allow-popups';
  return f;
}
// Documento en lectura (Markdown, notebook…): imágenes relativas desde la carpeta del archivo, enlaces en otra ventana y código coloreado.
function page(html, dir) {
  const d = document.createElement('div'); d.className = 'page'; d.innerHTML = html;
  // imágenes relativas del Markdown → se cargan desde la carpeta del archivo
  d.querySelectorAll('img[src]').forEach(i => { const s = i.getAttribute('src'); if (!/^[a-z]+:|^\//i.test(s)) i.src = raw(dir + '/' + decodeURI(s)); });
  d.querySelectorAll('a[href]').forEach(a => a.target = '_blank');
  d.querySelectorAll('pre code').forEach(c => hljs.highlightElement(c));
  return d;
}
// Código en lectura con números de línea y colores (sin colores por encima de 500 KB, para no bloquear la ventana).
function codeView(V, text, lang) {
  const lines = text.split('\n').length, d = document.createElement('div');
  d.className = 'code';
  d.innerHTML = `<pre class="nums">${Array.from({ length: lines }, (_, i) => i + 1).join('\n')}</pre><pre><code></code></pre>`;
  const code = d.querySelector('code'); code.textContent = text;
  if (text.length < 500000 && hljs.getLanguage(lang)) { code.className = 'language-' + lang; hljs.highlightElement(code); }
  V.className = 'flush'; V.append(d);
}
// CSV/TSV a filas, con comillas y saltos de línea dentro de los campos ("" es una comilla).
function parseDelimited(t, sep) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === '') q = true;
    else if (c === sep) { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
// Tabla en lectura: la primera fila como cabecera y hasta 2000 filas (avisa si hay más).
function tableView(V, text, sep) {
  const rows = parseDelimited(text, sep), max = 2000;
  const t = document.createElement('table'); t.className = 'grid';
  t.innerHTML = rows.slice(0, max).map((r, i) => `<tr>${r.map(c => i ? `<td title="${esc(c)}">${esc(c)}</td>` : `<th>${esc(c)}</th>`).join('')}</tr>`).join('');
  if (rows.length > max) V.insertAdjacentHTML('beforeend', `<div class="warnbox">Se muestran ${max} de ${rows.length} filas.</div>`);
  V.append(t);
}
// Notebook de Jupyter en lectura: celdas Markdown, código coloreado y salidas (texto e imágenes).
function notebookView(V, text, dir) {
  let nb; try { nb = JSON.parse(text); } catch { return codeView(V, text, 'json'); }
  const lang = nb.metadata?.kernelspec?.language || 'python', src = s => Array.isArray(s) ? s.join('') : s || '';
  let html = '';
  for (const c of nb.cells || []) {
    if (c.cell_type === 'markdown') { html += `<div class="cell">${marked.parse(src(c.source))}</div>`; continue; }
    html += `<div class="cell"><pre><code class="language-${lang}">${esc(src(c.source))}</code></pre>`;
    for (const o of c.outputs || []) {
      const d = o.data || {};
      if (o.text) html += `<div class="out"><pre>${esc(src(o.text))}</pre></div>`;
      else if (d['image/png']) html += `<div class="out"><img src="data:image/png;base64,${src(d['image/png']).trim()}"></div>`;
      else if (d['text/html']) html += `<div class="out">${src(d['text/html'])}</div>`;
      else if (d['text/plain']) html += `<div class="out"><pre>${esc(src(d['text/plain']))}</pre></div>`;
      else if (o.ename) html += `<div class="out"><pre>${esc(o.ename + ': ' + o.evalue)}</pre></div>`;
    }
    html += '</div>';
  }
  V.append(page(DOMPurify.sanitize(html), dir));
}
// Word en lectura con docx-preview (colores, fuentes y páginas como en Word); sin internet, mammoth.
// Editando se dibuja el Word del paso actual del historial y se activan la edición y el soltar imágenes.
async function docxView(V, f) {
  const s = curSeq(); // si mientras convierte se abre otra cosa, no se añade encima
  try {
    const node = wedit?.path === f.ruta && wedit.node; // editando: el Word tal como está en ese paso del historial
    const buf = await (await fetch(node ? `/api/hist/docx?ruta=${encodeURIComponent(f.ruta)}&id=${node}` : raw(f.ruta), { cache: 'no-store' })).arrayBuffer();
    if (!live(s)) return;
    if (window.docx?.renderAsync) { // como en Word: colores, fuentes, tamaños y páginas
      const box = document.createElement('div'); box.className = 'docxbox';
      V.className = 'flush'; V.append(box);
      await docx.renderAsync(buf, box, null, { className: 'docx', inWrapper: true, breakPages: true,
        ignoreLastRenderedPageBreak: true, renderHeaders: true, renderFooters: true, experimental: true });
      docxDrop(box, f.ruta); // soltar una imagen sobre un párrafo la inserta ahí
      if (wedit?.path === f.ruta && live(s)) await wordEditable(box, f.ruta);
      return;
    }
    if (wedit?.path === f.ruta) { wedit = null; ask('Editar Word', 'Para editar hace falta el visor de Word, que se carga de internet. Sin conexión solo se puede leer.', ['Entendido']); }
    const { value } = await mammoth.convertToHtml({ arrayBuffer: buf }); // reserva sin internet: sin colores
    if (live(s)) V.append(page(DOMPurify.sanitize(value), ''));
  } catch (e) { if (live(s)) card(V, f); }
}
// ---------- editar un Word a mano: texto y formato básico sobre la vista; se guarda como cambios por párrafo ----------
// Cada <p> del visor se empareja con su w:p del archivo (mismo texto, en orden); los que no casan (encabezados,
// tabulaciones, campos) quedan de solo lectura. Al guardar, el texto cambiado y los B/I/U/color van a /api/docx.
let wedit = null; // { path, mtime, node (paso del historial que se ve; null = el archivo), ps: [{ el, i, base }], dirty }
const WCOLORS = [['Rojo', 'FF0000'], ['Azul', '0070C0'], ['Verde', '00B050'], ['Naranja', 'FFA500'], ['Morado', '7030A0'], ['Negro', '000000']];
function wordEdit(path) { pinTab(path); wedit = { path, node: null, fresh: true, dirty: false }; render(); }
// empareja cada <p> del visor con su w:p (mismo texto, en orden); los que no casan quedan fuera
async function docxMap(box, path, node) {
  const { parrafos, mtime } = node ? { parrafos: await api(`/api/hist/parrafos?ruta=${encodeURIComponent(path)}&id=${node}`) }
    : await api('/api/docx/parrafos?ruta=' + encodeURIComponent(path)), ps = [], fuera = [];
  let j = 0;
  for (const el of box.querySelectorAll('section.docx p')) {
    if (el.closest('header, footer')) continue;
    const t = el.textContent.normalize('NFC');
    let k = -1;
    for (let x = j; x < Math.min(parrafos.length, j + (t ? 8 : 1)); x++) if (parrafos[x] === t) { k = x; break; }
    if (k < 0) { fuera.push(el); continue; }
    j = k + 1;
    ps.push({ el, i: k, base: t });
  }
  return { ps, fuera, mtime };
}
// Convierte los párrafos emparejados en editables (contentEditable) y conecta: historial (un paso tras
// cada pausa), Enter bloqueado (párrafos nuevos → IA), pegar solo texto y Ctrl+B/I/U.
async function wordEditable(box, path) {
  const { ps, fuera, mtime } = await docxMap(box, path, wedit.node);

function wordFlush() { // el texto tecleado → cambios {parrafo, desde, buscar, reemplazar}
  const ops = [];
  for (const p of wedit.ps) {
    const now = p.el.textContent.normalize('NFC'), old = p.base;
    if (now === old) continue;

    else {
      let a = 0, s = 0;
      while (a < old.length && a < now.length && old[a] === now[a]) a++;
      while (s < old.length - a && s < now.length - a && old[old.length - 1 - s] === now[now.length - 1 - s]) s++;
      if (a + s === old.length) a ? a-- : s--; // solo se añadió texto: se incluye un carácter vecino para poder buscarlo
      ops.push({ parrafo: p.i, desde: a, buscar: old.slice(a, old.length - s), reemplazar: now.slice(a, now.length - s) });

}

  const half = (p, e) => { const r = p.getBoundingClientRect(); return e.clientY > r.top + r.height / 2; };
  const skip = e => fromOutside(e) && wedit?.path !== path; // desde fuera solo se inserta en edición; si no, se abre en pestaña

  });
  box.addEventListener('dragleave', e => { if (!box.contains(e.relatedTarget)) mark(null); });

    const p = target(e); mark(null);
    if (skip(e)) return; // sigue hasta document.ondrop: se abre en pestaña

    const ruta = e.dataTransfer.getData('text/desklens-path') || (own ? rawPath(own[1]) : '');
    const file = !ruta && e.dataTransfer.files[0], nombre = ruta ? ruta.split(/[\\/]/).pop() : file?.name || '';
    if (!/\.(png|jpe?g|gif|bmp)$/i.test(nombre)) return ask('Insertar imagen', nombre

    const op = { imagen: ruta || nombre, posicion: half(p, e) ? 'despues' : 'antes', buscar: '' };
    if (file) op.datos = await b64(file);
    if (wedit?.path === path) { // editando: la imagen es un paso más (se guarda con Guardar)
      const w = wedit.ps.find(x => x.el === p);
      if (!w) return ask('Insertar imagen', 'Ese párrafo no se puede usar aquí: suéltala sobre otro.', ['Entendido']);
      await wordStep();
      const id = await histStep(path, `🖼 Imagen ${op.posicion === 'antes' ? 'antes de' : 'después de'} «${w.base.trim().slice(0, 30)}»: ${nombre}`,
        b64txt(JSON.stringify([{ ...op, parrafo: w.i }])));
      if (id) { wordDirty(); hists.get(path).restore(id); }
      return;
    }
    const { ps, mtime } = await docxMap(box, path), w = ps.find(x => x.el === p);

// Escribe el PDF con pdf-lib a partir de su copia de partida: dibuja notas y resaltados, y reordena, gira o

async function pdfSave() {
  if (!pedit?.dirty) return flash('No hay cambios');
  try {
    const L = await loadPdfLib();
    // se parte de la copia que se está editando (si se volvió a un paso de antes de otro guardado, no es la del disco)
    const bytes = await (await fetch(pedit.baseId ? histUrl(pedit.path, pedit.baseId, 'base') : raw(pedit.path), { cache: 'no-store' })).arrayBuffer();

    for (const [src, list] of Object.entries(pedit.notes)) for (const n of list) {
      if (n.t === 'resaltar') pages[src].drawRectangle({ x: n.x, y: n.y, width: n.w, height: n.h, color: L.rgb(1, .9, 0), opacity: .35 });
      else {
        try { pages[src].drawText(n.text, { x: n.x, y: n.y, size: n.size, font, color: rgb(n.color), rotate: L.degrees(n.rot) }); }

        doc.addPage(pages[p.src]);
      }
    }
    const r = await api('/api/binario', { ruta: pedit.path, datos: await b64(new Blob([await doc.save()])), mtime: pedit.mtime });
    // se vuelve a leer del disco: lo guardado es el nuevo punto de partida
    Object.assign(pedit, { doc: null, baseId: null, dirty: false, saved: true, last: r.deshacer });
    await histSaved(pedit.path); // 💾: lo guardado es la copia de partida de los pasos siguientes

// Es un árbol: deshacer y luego editar no borra nada (lo deshecho queda como «otra versión»).

    const r = await api('/api/hist?ruta=' + encodeURIComponent(path)).catch(() => ({ nodos: [], disco: null }));
    h = { nodos: r.nodos, actual: r.disco, disco: r.disco, vino: null, cola: Promise.resolve() };

const noAsk = new Set(); // "no volver a preguntar" (hasta cerrar DeskLens)

// Confirmación antes de ejecutar: la orden (editable para las pruebas), la carpeta y «no volver a preguntar».

// ▶ Ejecutar el archivo: guarda antes si hay cambios, confirma (salvo «no volver a preguntar») y lo lanza en la consola.
async function runFile(path, f) {
  const ed = edits.get(path);
  if (ed && isDirty(ed)) {
    if (await ask('Cambios sin guardar', `Guarda "${f.nombre}" antes de ejecutarlo.`, ['Guardar y ejecutar', 'Cancelar']) !== 'Guardar y ejecutar') return;
    await save(path); if (isDirty(ed)) return;
  }
  if (!noAsk.has(path)) {
    const r = await runDialog('Ejecutar ' + f.nombre, f.ejecutar.texto, f.ejecutar.carpeta, false);
    if (!r) return;
    if (r.skip) noAsk.add(path);
  }
  const again = () => api('/api/ejecutar', { ruta: path });

// Ejecutar las pruebas del proyecto con el comando detectado o el guardado (se recuerda el que se confirme).
async function runTests(path, name) {
  const t = await api('/api/pruebas?ruta=' + encodeURIComponent(path));

    const note = t.guardado ? '' : comando ? 'Comando detectado: corrígelo si hace falta. Se recordará para este proyecto.'
      : 'No se detectó un comando de pruebas. Escríbelo (por ejemplo: php artisan test). Se recordará.';

// Arranca un proceso en el servidor y crea su pestaña en la consola; poll() va trayendo la salida.
async function launch(start, label, cmd, cwd, ruta, onDone = null) {
  let res;
  try { res = await start(); } catch (e) { return ask('No se pudo ejecutar', e.message, ['Entendido']); }
  const r = { id: res.id, label, cmd, cwd, ruta, onDone, again: start, trozos: [], fin: false, codigo: null, dur: 0 };
  runsUI.push(r); curRun = r;
  // como mucho 7 pestañas: se quitan las terminadas más antiguas (las que siguen corriendo, nunca)
  while (runsUI.length > 7) { const old = runsUI.find(x => x.fin && x !== r); if (!old) break; runsUI.splice(runsUI.indexOf(old), 1); }
  showPanel(true); drawRuns(); poll(r);
  return r;
}

async function poll(r) {
  while (!r.fin) {
    try {
      const d = await api(`/api/salida?id=${r.id}&desde=${r.trozos.length}`);
      r.trozos.push(...d.trozos); Object.assign(r, { fin: d.fin, codigo: d.codigo, dur: d.dur });
      if (r === curRun) { appendOut(d.trozos); drawRunBar(); }
      if (r.fin) drawRunTabs();
    } catch { r.fin = true; drawRuns(); }
    if (!r.fin) await new Promise(ok => setTimeout(ok, 300));

// Pestañas de la consola: una por ejecución, con ✓/✗ según el código de salida.
function drawRunTabs() {

    el.innerHTML = '<span></span><b title="Cerrar">✕</b>';
    el.firstChild.textContent = `${r.fin ? (r.codigo === 0 ? '✓' : '✗') : '●'} ${r.label}`;
    el.onclick = () => { curRun = r; drawRuns(); };
    el.querySelector('b').onclick = e => { e.stopPropagation(); closeRun(r); };
    T.append(el);
  }

// Añade salida a la consola; solo baja al final si ya se estaba al final (no mueve a quien está leyendo arriba).

  // ↑ ↓: órdenes anteriores de esta terminal (solo con el cuadro de una línea, para no estorbar al editar varias)
  const r = curRun; if (!r?.term || !r.hist?.length || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') || $('#stdin').value.includes('\n')) return;
  e.preventDefault();
  r.hi = Math.max(0, Math.min(r.hist.length, (r.hi ?? r.hist.length) + (e.key === 'ArrowUp' ? -1 : 1)));
  $('#stdin').value = r.hist[r.hi] ?? ''; stdinFit();
});
// ＞ Terminal: cmd en la carpeta del proyecto (el del archivo abierto, el elegido en Git o el primero) para escribir órdenes
function termCwd() {
  const ps = side?.proyectos || [], inside = p => p && ps.find(x => p.toLowerCase().startsWith(x.ruta.toLowerCase() + '\\') || p.toLowerCase() === x.ruta.toLowerCase());
  return (inside(cur) || inside(gst?.ruta) || ps[0])?.ruta;
}
async function openTerminal(cwd = termCwd()) {

  const r = await launch(() => api('/api/terminal', { cwd }), '＞ Terminal · ' + cwd.split(/[\\/]/).pop(), 'terminal (cmd)', cwd, cwd);

// ---------- IA: un solo chat. DeskLens prepara el contexto con Python, sin gastar tokens ----------
let iaState = { ias: [], pref: { limite: 2000, carga: {} } }, rulesInfo = null, sel = null, curFile = null, editorCM = null;
let conv = null, ctx = [], manual = [], consoleCtx = null;
let dropped = []; // soltados desde el Explorador de Windows: solo su contenido (sin ruta, solo lectura)
const seeImg = new Set(), IMG_TOK = 1600; // 👁 imágenes que la IA ve (JPEG ≤ 1568 px ≈ 1.600 tokens)
const extFiles = new Map(); // imágenes soltadas desde Windows: para meterlas en un Word aunque no tengan ruta
const removed = new Set(), textCache = new Map();

// ---------- contexto automático: archivo abierto, archivos nombrados, páginas, selección ----------
document.addEventListener('selectionchange', () => {
  if (editorCM) return; // en el editor la selección la da CodeMirror
  const s = getSelection();
  if (!s.rangeCount || !$('#view').contains(s.anchorNode)) return;
  sel = { path: cur, text: s.toString() };
  iaRefresh();
});
function selectedText() {
  if (!sel || sel.path !== cur) return '';
  return (sel.start !== undefined ? srcText().slice(sel.start, sel.end) : sel.text || '').trim();
}
// "página 40", "páginas 27 a 35", "pág. 27-30", "página 27 en adelante" (10 páginas). Numeración del visor de PDF.
function parsePages(t) {
  const m = plainTxt(t).match(/\bpag(?:ina)?s?\.?\s*(\d+)(?:\s*(?:a|al|hasta|-|–|y)\s*(?:la\s+)?(?:pag(?:ina)?\.?\s*)?(\d+)|\s+(en adelante))?/);
  if (!m) return null;
  const a = +m[1], b = m[2] ? +m[2] : m[3] ? a + (AJ.ia_pdf_en_adelante || 10) - 1 : a, lo = Math.min(a, b);
  return [lo, Math.min(Math.max(a, b), lo + (AJ.ia_pdf_max_paginas || 50) - 1)];
}
const rkey = c => c.ruta || c.nombre;
const sentKey = (nombre, desc, tokens) => kind(nombre).ext === 'pdf' ? `${nombre}|${desc}` : `${nombre}|${desc}|${tokens}`;
const cachedText = ruta => {
  if (!textCache.has(ruta)) textCache.set(ruta, api('/api/extraer?ruta=' + encodeURIComponent(ruta)).catch(e => ({ error: e.message })));
  return textCache.get(ruta);
};

let ctxTimer = 0, ctxSeq = 0;
function iaRefresh() { clearTimeout(ctxTimer); ctxTimer = setTimeout(buildContext, 350); }
// «Se enviará»: el archivo abierto, los nombrados en el mensaje, las páginas pedidas de un PDF, la selección
// y lo soltado, con sus tokens. Las peticiones que llegan tarde (otro mensaje ya escrito) se descartan.
async function buildContext(msgText) { // msgText: al enviar, el cuadro ya está vacío
  if (!document.body.classList.contains('ia')) return ctx;
  const seq = ++ctxSeq, msg = msgText ?? $('#convQ').value, pages = parsePages(msg), items = [];
  const add = it => { if (!items.some(i => i.ruta === it.ruta)) items.push(it); };
  if (curFile?.ruta) add({ ruta: curFile.ruta, nombre: curFile.nombre, abierto: true });
  if (msg.trim()) for (const f of await api('/api/contexto', { mensaje: msg, ruta: curFile?.ruta || conv?.proyecto || '' }).catch(() => [])) add(f);
  manual.forEach(add);
  const sent = new Set((conv?.adjuntos || []).map(a => sentKey(a.nombre, a.desc, a.tokens))), out = [];
  const selTxt = selectedText();
  if (selTxt && curFile) out.push({ nombre: 'Texto seleccionado', desc: curFile.nombre, texto: selTxt, tokens: Math.ceil(selTxt.length / 4) });
  for (const it of items) {
    const k = kind(it.nombre), c = { ...it, desc: '', tokens: 0 };
    if (k.lock && AJ.ia_permitir_sensibles === false) c.aviso = '🔒 sensible: desactivado en ⚙ Ajustes';
    else if (k.ext === 'pdf') {
      // un PDF soltado trae sus páginas; si no, las del mensaje; si no se nombran, la que se ve en pantalla
      const pg = it.pages || pages || (it.abierto && [pdfAt(it.ruta), pdfAt(it.ruta)]);
      if (!pg) c.aviso = 'di qué páginas: «página 40» o «páginas 27 a 35»';
      else Object.assign(c, { pages: pg, desc: pg[0] === pg[1] ? `pág. ${pg[0]}` : `págs. ${pg[0]}–${pg[1]}`, tokens: (pg[1] - pg[0] + 1) * 600, aprox: true });
    } else if (it.abierto && curFile.texto !== null) {
      c.texto = srcText(); c.tokens = Math.ceil(c.texto.length / 4);
    } else {
      const r = await cachedText(it.ruta);
      if (r.error) c.aviso = r.error;
      else Object.assign(c, { texto: r.texto, tokens: r.tokens, ref: r.ref, imagen: r.imagen, desc: r.ref ? 'referencia' : '' });
    }
    if (c.imagen && seeImg.has(rkey(c))) Object.assign(c, { ver: true, tokens: c.tokens + IMG_TOK });
    if (!c.aviso && sent.has(sentKey(c.nombre, c.desc, c.tokens))) c.enviado = true;
    if (removed.has(rkey(c))) c.quitado = true;
    out.push(c);
  }
  if (seq !== ctxSeq) return ctx;
  ctx = out; drawCtx();
  return ctx;
}
const toSendList = () => [...ctx.filter(c => !c.aviso && !c.enviado && !c.quitado), ...dropped, ...(consoleCtx ? [consoleCtx] : [])];
// Dibuja «Se enviará»: cada adjunto con sus tokens, ✕ para quitarlo, 👁 en imágenes y los avisos con su nombre.
function drawCtx() {
  const C = $('#ctx'); C.innerHTML = '';
  const all = [...ctx, ...dropped, ...(consoleCtx ? [consoleCtx] : [])];
  if (all.length) C.append(Object.assign(document.createElement('span'), { className: 'ok', textContent: 'Se enviará:' }));
  for (const c of all) {
    const d = document.createElement('div'); d.className = 'att';
    const toggle = !c.aviso && !c.enviado;
    d.innerHTML = `<span>${c.aviso ? '⚠️' : c.enviado ? '✓' : c.imagen ? '🖼' : '📄'}</span><span class="n"></span><span class="ok"></span>` +
      (c.imagen && toggle && !c.quitado ? `<i class="eye${c.ver ? ' on' : ''}" title="${c.ver ? 'Enviar solo el nombre' : `Que la IA vea la imagen (≈ ${IMG_TOK} tokens; solo Claude)`}">👁</i>` : '') +
      (toggle ? `<b title="${c.quitado ? 'Volver a incluir' : 'No enviar'}">${c.quitado ? '↺' : '✕'}</b>` : '');
    d.querySelector('.n').textContent = c.nombre + (c.desc ? ' · ' + c.desc : '') + (c.ver ? ' · la IA la ve' : '') + (c.abierto ? ' (abierto)' : '');
    d.querySelector('.ok').textContent = c.quitado ? 'no se envía' : c.enviado ? 'ya en la conversación' : c.aviso ? '' : `≈ ${c.tokens} tok`;
    if (c.aviso) d.append(Object.assign(document.createElement('div'), { className: 'aviso warn', textContent: c.aviso }));
    if (c.quitado) d.style.opacity = '.5';
    d.querySelector('.eye')?.addEventListener('click', () => {
      if (!dropped.includes(c)) return seeImg.has(rkey(c)) ? seeImg.delete(rkey(c)) : seeImg.add(rkey(c)), buildContext();
      c.ver = !c.ver; c.tokens += c.ver ? IMG_TOK : -IMG_TOK; drawCtx();
    });
    d.querySelector('b')?.addEventListener('click', () => {
      if (c === consoleCtx) consoleCtx = null;
      else if (dropped.includes(c)) dropped = dropped.filter(x => x !== c);
      else removed.has(rkey(c)) ? removed.delete(rkey(c)) : removed.add(rkey(c));
      buildContext();
    });
    C.append(d);
  }
  const more = button('+ Otro archivo', e => addOther(e)); more.className = 'small';
  C.append(more);
  convEst();
}
// "+ Otro archivo": pestañas abiertas y archivos de la carpeta del proyecto (con buscador)
async function addOther(e) {
  e.stopPropagation();
  const anchor = e.currentTarget, folder = conv?.proyecto || rulesInfo?.proyecto?.ruta || curFile?.ruta.replace(/[\\/][^\\/]*$/, '');
  const paths = new Set(tabs);
  if (folder) for (const i of await api('/api/dir?ruta=' + encodeURIComponent(folder)).catch(() => [])) if (!i.dir) paths.add(i.ruta);
  const items = [...paths].filter(p => AJ.ia_permitir_sensibles !== false || !kind(p.split(/[\\/]/).pop()).lock)
    .map(p => [p.split(/[\\/]/).pop(), () => { manual.push({ ruta: p, nombre: p.split(/[\\/]/).pop() }); removed.delete(p); buildContext(); }]);
  if (!items.length) return ask('Otro archivo', 'Abre un archivo o un proyecto para ver qué se puede añadir.', ['Entendido']);

// PDF: el texto de las páginas pedidas se extrae aquí con pdf.js (nunca el libro entero)
let pdfjsReady = null;
const loadPdfJs = () => pdfjsReady ||= new Promise((ok, fail) => {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
  s.onerror = () => { pdfjsReady = null; fail(new Error('No se pudo cargar el lector de PDF (¿sin internet?)')); };
  document.head.append(s);
});
async function pdfPages(ruta, a, b) {
  return pdfText(await (await loadPdfJs()).getDocument(raw(ruta)).promise, a, b);
}
async function pdfText(doc, a, b) { // doc: PDF ya abierto (de una ruta de DeskLens o de un archivo soltado)
  if (a > doc.numPages) throw new Error(`El PDF solo tiene ${doc.numPages} páginas`);
  let out = '';
  for (let i = a; i <= Math.min(b, doc.numPages); i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    out += `\n\n[Página ${i}]\n` + tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+\n/g, '\n');
  }
  if (!out.replace(/\[Página \d+\]/g, '').trim()) throw new Error('Esas páginas del PDF no tienen texto (¿es escaneado?)');
  return out.trim();
}

// ---------- conversación (se guarda en disco; con Claude continúa su sesión) ----------
// 🔗 Chat vinculado a la pestaña (predeterminado): cada archivo tiene su conversación, que reaparece al volver.
// Apagado: un chat general que no cambia con la pestaña. El estado se recuerda.
let linked = LS('desklens.vincular') !== '0', convTab;
const convMap = () => { try { return JSON.parse(LS('desklens.convPorPestana') || '{}'); } catch { return {}; } };
// '' = el usuario pidió un chat nuevo (vacío) para esa pestaña; sin entrada = se usa la conversación más reciente
const setConvMap = (tab, id) => { const m = convMap(); m[tab] = id || ''; LS('desklens.convPorPestana', JSON.stringify(m)); };
const sameTab = (a, b) => (a || '').toLowerCase() === (b || '').toLowerCase();
const draftKey = () => linked && cur ? 'desklens.borrador:' + recKey(cur) : 'desklens.borrador'; // borrador por pestaña

// Selector de conversaciones: con 🔗, las de la pestaña actual; si no, todas. Elige la indicada o la más reciente.
async function loadConvList(selectId) {
  const all = await api('/api/conv').catch(() => []), S = $('#convSel');
  const list = linked ? all.filter(c => cur && sameTab(c.vinculo, cur)) : all;
  if (selectId === undefined) selectId = list[0]?.id || ''; // la más reciente de esa pestaña (la lista viene ordenada)
  S.innerHTML = '';
  S.append(new Option(linked ? (cur ? '— Chat nuevo de esta pestaña —' : '— Abre un archivo —') : '— Nueva conversación —', ''));
  for (const c of list) S.append(new Option(`${c.titulo} · ${c.fecha} · ${c.n / 2} turno${c.n === 2 ? '' : 's'}`
    + (!linked && c.vinculo ? ' · 🔗 ' + tabName(c.vinculo) : ''), c.id));
  S.value = list.some(c => c.id === selectId) ? selectId : '';
  if ((conv?.id || '') !== S.value) await openConv(S.value);
  else drawConv();
  drawLink();
}
// Abre una conversación (o ninguna = chat nuevo) y recuerda cuál es la de esta pestaña o la general.
async function openConv(id) {
  conv = id ? await api('/api/conv?id=' + id).catch(() => null) : null;
  if (!linked) LS('desklens.conv', conv?.id || '');
  else if (cur) setConvMap(cur, conv?.id || '');
  drawConv(); buildContext();
}
// Al cambiar de pestaña: su conversación (o un chat vacío si nunca tuvo) y su borrador
async function syncConvToTab(force = false) {
  if (!linked || (!force && convTab !== undefined && sameTab(convTab, cur))) return;
  convTab = cur;
  $('#convQ').value = LS(draftKey()) || '';
  await loadConvList(cur ? convMap()[cur] : ''); // undefined → la más reciente de la pestaña
}
// Botón 🔗: chat vinculado a la pestaña (cada archivo su conversación) o chat general.
function drawLink() {
  const B = $('#convLink');
  B.classList.toggle('on', linked);
  B.querySelector('span').textContent = linked ? (cur ? tabName(cur) : 'sin pestaña') : 'General';
  B.title = linked ? `Chat vinculado a la pestaña «${cur ? tabName(cur) : 'ninguna'}». Clic: chat general`
    : 'Chat general: no cambia con la pestaña. Clic: vincular a la pestaña';
}
$('#convLink').onclick = async () => {

$('#convSel').onchange = () => openConv($('#convSel').value);
$('#convNew').onclick = () => { $('#convSel').value = ''; openConv(''); $('#convQ').focus(); };
$('#convDel').onclick = async () => {
  if (!conv || await ask('Borrar conversación', `¿Borrar «${conv.titulo}»? No se puede deshacer.`, ['Borrar', 'Cancelar'], { danger: true }) !== 'Borrar') return;
  await api('/api/conv/borrar', { id: conv.id }); conv = null;

};
// La conversación: mensajes del usuario y respuestas de la IA con sus acciones (aplicar, deshacer, crear archivo…).
function drawConv() {
  const L = $('#convLog'); L.innerHTML = '';
  if (!conv) L.innerHTML = '<p class="ok" style="padding:4px">Escribe lo que necesitas. Si nombras un archivo del proyecto o unas páginas del PDF abierto, DeskLens los adjunta solo (míralo en «Se enviará»). La conversación se recuerda.</p>';
  let abierto = '';
  (conv?.mensajes || []).forEach((m, i) => {
    if (m.rol === 'tu') { abierto = m.abierto || ''; L.append(userMsg(m.texto, m.adjuntos)); }
    else L.append(iaMsg(m, abierto, i));
  });
  L.scrollTop = L.scrollHeight;
}
function userMsg(texto, adjuntos = []) {
  const d = document.createElement('div'); d.className = 'msgtu'; d.textContent = texto;
  if (adjuntos?.length) d.append(Object.assign(document.createElement('small'), { textContent: '📎 ' + adjuntos.join(', ') }));
  return d;
}

// Respuesta: texto + archivos pedidos (<<<ARCHIVO …ARCHIVO>>>) + cambios al archivo abierto (BUSCAR/REEMPLAZAR)
const FILE_RE = /<<<ARCHIVO[ \t]+([^\n]+)\n([\s\S]*?)\n?ARCHIVO>>>/g;
const EDIT_RE = /<<<<<<< BUSCAR\n[\s\S]*?>>>>>>> REEMPLAZAR\n?/g;
const replyFiles = t => [...t.matchAll(FILE_RE)].map(x => ({ nombre: x[1].trim(), texto: x[2] }));
const DOCX_RE = /<<<DOCX\s*([\s\S]*?)\s*DOCX>>>/g;
const replyClean = t => t.replace(FILE_RE, (_, n) => `\n📄 **${n.trim()}**\n`).replace(EDIT_RE, '').replace(DOCX_RE, '').trim();
// Cambios para un Word: <<<DOCX {"buscar": "...", "color": "rojo"} DOCX>>> (un objeto o una lista por bloque)
function replyDocx(t) {
  const ops = [];
  for (const m of t.matchAll(DOCX_RE)) {
    try { const v = JSON.parse(m[1]); ops.push(...(Array.isArray(v) ? v : [v])); } catch { ops.push({ error: m[1] }); }
  }
  return ops;
}
// Texto legible de un cambio propuesto para Word, p. ej. «Título»: color rojo, negrita · 🖼 portada.png después de «…».
function describeOp(o) {
  if (o.error) return `⚠ bloque ilegible: ${o.error.slice(0, 60)}`;
  if (o.imagen) return `🖼 ${String(o.imagen).split(/[\\/]/).pop()} ${o.posicion === 'antes' ? 'antes de' : 'después de'} «${o.buscar}»` + (o.ancho_cm ? ` · ${o.ancho_cm} cm` : '');
  const parts = [];
  if (o.reemplazar !== undefined) parts.push(`texto → «${o.reemplazar}»`);
  if (o.color) parts.push(`color ${o.color}`);
  for (const [k, n] of [['negrita', 'negrita'], ['cursiva', 'cursiva'], ['subrayado', 'subrayado']]) if (k in o) parts.push((o[k] ? '' : 'sin ') + n);
  if (o.tamano) parts.push(`${o.tamano} pt`);
  if (o.resaltado) parts.push(`resaltado ${o.resaltado}`);
  if (o.fuente) parts.push(`fuente ${o.fuente}`);
  return `«${o.buscar}»${o.todas ? ' (todas)' : ''}: ${parts.join(', ') || 'sin cambios'}`;
}
async function applyDocx(ruta, ops, mtime) { // mtime: edición a mano (falla si el Word cambió en disco mientras tanto)

// Crea el archivo que propone la IA (<<<ARCHIVO …>>>) en la carpeta del proyecto, sin pisar uno existente (nombre-2…).
async function makeFile(f, auto) {

// Aplica bloques BUSCAR/REEMPLAZAR de la IA al archivo abierto en el editor (sin guardar: se revisa y se guarda).
async function applyEditBlocks(ruta, blocks) {
  if (!ruta) { ask('Aplicar cambios', 'Este mensaje no tenía un archivo abierto al que aplicar los cambios.', ['Entendido']); return false; }
  if (cur !== ruta) openTab(ruta, true);
  if (!edits.has(ruta)) startEdit(ruta, await api('/api/abrir?ruta=' + encodeURIComponent(ruta)));
  const ed = edits.get(ruta), out = applyBlocks(ed.text, blocks.map(([s, r]) => [norm(s), norm(r)]));
  if (out === null) { ask('No se pudo aplicar', 'El texto a buscar no aparece exactamente una vez en el archivo (¿cambió desde entonces?).', ['Entendido']); return false; }
  ed.text = out; pinTab(ruta); backupSoon(ruta);
  if (cur === ruta) await render();
  flash('Cambio aplicado · guarda con Ctrl+S');
  return true;
}
function parseBlocks(t) {
  return [...norm(t).matchAll(/<<<<<<< BUSCAR\n([\s\S]*?)\n?=======\n([\s\S]*?)\n?>>>>>>> REEMPLAZAR/g)].map(m => [m[1], m[2]]);
}
// Cada BUSCAR debe aparecer exactamente una vez; si no, null y no se cambia nada (todo o nada).
function applyBlocks(text, blocks) {
  let out = text;
  for (const [s, r] of blocks) {
    const i = out.indexOf(s);
    if (!s || i < 0 || out.indexOf(s, i + 1) >= 0) return null;
    out = out.slice(0, i) + r + out.slice(i + s.length);
  }
  return out;
}

  try { await img.decode(); } catch { throw new Error('No se pudo abrir la imagen para enviarla a la IA'); }

  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
  return { media: 'image/jpeg', data: cv.toDataURL('image/jpeg', .85).split(',')[1] };

// ✓ Verificar citas: extrae las referencias, las ejecuta con verificar_citas.py y deja el resultado listo para enviar
function findRefs(t) {
  const out = new Set(), book = '(?:[123] )?[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+';
  for (const m of t.matchAll(new RegExp(`(${book}) (\\d+):(\\d+)(?:[-–](\\d+))?((?:,\\s*\\d+(?:[-–]\\d+)?)*)`, 'g'))) {
    const [, b, ch, v1, v2, more] = m;
    out.add(`${b} ${ch}:${v1}${v2 ? '-' + v2 : ''}`);
    for (const x of more.matchAll(/(\d+)(?:[-–](\d+))?/g)) out.add(`${b} ${ch}:${x[1]}${x[2] ? '-' + x[2] : ''}`);
  }
  return [...out];
}

// ---------- reglas: Markdown a la izquierda, vista previa a la derecha ----------
function addRule(t, rule, sec) {
  const line = '- ' + rule;
  const m = sec && [...t.matchAll(/^## (.+)$/gm)].find(x => x[1].trim() === sec);
  if (!m) return t.replace(/\n*$/, '\n') + line + '\n';
  const after = m.index + m[0].length, next = t.slice(after).search(/^#{1,2} /m);
  const end = next < 0 ? t.length : after + next;
  return t.slice(0, end).replace(/\n*$/, '\n') + line + '\n' + (end < t.length ? '\n' + t.slice(end) : '');
}
// Modal de reglas.md: editor a la izquierda y vista previa a la derecha; se guarda en el proyecto.
function rulesDialog() {
  const info = rulesInfo?.reglas, proj = rulesInfo?.proyecto;
  if (!info) return;
  const d = $('#dlg');
  d.className = 'rules'; d.oninput = d.onchange = null; d.onclose = null;
  d.innerHTML = `<b></b><div class="rgrid"><div id="rEd"></div><div id="rPrev" class="page"></div></div>
    <form class="frow" id="rAdd">+ Nueva regla: <input id="rNew" placeholder="Ej.: Usar Tailwind, no Bootstrap"><select id="rSec"></select><button>Añadir</button></form>
    <div class="iarow"><span id="rCount" class="ok"></span><div class="exp-actions"><button class="primary" id="rSave">Guardar</button><button id="rCancel">Cancelar</button></div></div>`;
  d.querySelector('b').textContent = 'Reglas · ' + proj.nombre;
  const orig = norm(info.texto || '');
  const cm = CodeMirror($('#rEd'), { value: orig, mode: 'markdown', lineWrapping: true,
    theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'material-darker' : 'default' });
  CodeMirror.autoLoadMode(cm, 'markdown');
  const upd = () => {
    const t = cm.getValue(), n = (t.match(/^\s*[-*+]\s+\S/gm) || []).length, tok = Math.ceil(t.length / 4);
    $('#rPrev').innerHTML = DOMPurify.sanitize(marked.parse(t));
    const long = tok > (AJ.reglas_aviso_tokens || 300);
    $('#rCount').textContent = `${n} regla${n === 1 ? '' : 's'} · ≈ ${tok} tokens por petición` + (long ? ' · conviene acortarlas' : '');
    $('#rCount').className = long ? 'warn' : 'ok';
    const S = $('#rSec'), keep = S.value;
    S.innerHTML = '';
    S.append(new Option('al final', ''), ...[...t.matchAll(/^## (.+)$/gm)].map(m => new Option('en ' + m[1].trim(), m[1].trim())));
    S.value = [...S.options].some(o => o.value === keep) ? keep : '';
  };
  cm.on('change', upd); upd();
  $('#rAdd').onsubmit = e => {
    e.preventDefault();
    const r = $('#rNew').value.trim(); if (!r) return;
    cm.setValue(addRule(cm.getValue(), r, $('#rSec').value)); $('#rNew').value = ''; $('#rNew').focus();
  };
  $('#rCancel').onclick = async () => { if (cm.getValue() === orig || await ask('Descartar cambios', '¿Descartar los cambios en las reglas?', ['Descartar', 'Seguir editando'], { danger: true }) === 'Descartar') d.close(); };
  $('#rSave').onclick = async () => {
    const r = await fetch('/api/guardar', { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ ruta: info.ruta, texto: cm.getValue(), codificacion: info.codificacion, eol: info.eol, mtime: info.mtime }) });
    const res = await r.json();
    if (r.status === 409) return ask('reglas.md cambió', 'Se modificó fuera de este diálogo. Cierra y vuelve a abrir las reglas para no perder ningún cambio.', ['Entendido']);
    if (!r.ok) return ask('No se pudo guardar', res.error, ['Entendido']);
    d.close(); iaOnFile();
    if (edits.has(info.ruta)) flash('Ojo: reglas.md también está abierto en edición');
  };
  d.showModal(); setTimeout(() => cm.refresh(), 0);
}

async function openDropped(dt) {
  const files = [...dt.files].filter((f, i) => !dt.items[i]?.webkitGetAsEntry?.()?.isDirectory); // las carpetas no se abren
  if (!files.length) return ask('Abrir', 'Suelta archivos, no carpetas: para añadir una carpeta usa + «Añadir proyecto».', ['Entendido']);
  let r;
  try { r = await api('/api/soltados', { archivos: files.map(f => ({ nombre: f.name, tam: f.size, fecha: f.lastModified })) }); }
  catch (e) { return ask('No se pudieron abrir', e.message, ['Entendido']); }
  const ok = r.filter(x => x.ruta), miss = r.filter(x => !x.ruta);
  if (ok.length) { await loadSide(); ok.forEach(x => openTab(x.ruta, true)); }
  if (miss.length) ask('No encontré dónde está', `No pude saber la ruta de ${miss.map(x => `«${x.nombre}»`).join(', ')}. ` +
    'Ábrelo con + de «Sueltos» o arrástralo desde una ventana del Explorador.', ['Entendido']);
}

// Ir a la línea N: en el editor, con el cuadro de CodeMirror («línea» o «línea:columna»); en la vista de código
// numerada, se pide el número y se desplaza hasta ella marcándola un momento. En otras vistas avisa.
async function goToLine() {
  if (editorCM) return editorCM.execCommand('jumpToLine');
  const code = $('#view .code'), nums = code?.querySelector('.nums');
  if (!nums) return flash('Ir a la línea: solo en archivos de texto con líneas numeradas');
  const total = nums.textContent.split('\n').length;
  const v = await ask('Ir a la línea', `Número de línea (1–${total}):`, ['Ir', 'Cancelar'], { input: '', numeric: true });
  const n = Math.min(total, Math.max(1, parseInt(v, 10) || 0));
  if (!v || !n) return;
  const pad = parseFloat(getComputedStyle(nums).paddingTop), lh = (nums.offsetHeight - 2 * pad) / total;
  const V = $('#view'), mark = document.createElement('div'), y = pad + (n - 1) * lh;
  V.scrollTop = code.offsetTop + y - V.clientHeight / 3;
  mark.className = 'linemark'; mark.style.top = y + 'px'; mark.style.height = lh + 'px';
  code.append(mark); setTimeout(() => mark.remove(), 1500);
}

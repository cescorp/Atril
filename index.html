// ---------- índice: estado abajo a la izquierda, modal con detalles y lectura de PDFs en segundo plano ----------
let idxInfo = null;
const pdfWork = { actual: '', pagina: 0, total: 0 };
const sleep = ms => new Promise(ok => setTimeout(ok, ms));
// Pregunta al servidor por el índice cada 2 s mientras trabaja y cada 15 s si está quieto, para la barra de estado.
async function idxPoll() {
  try { idxInfo = await api('/api/indice'); } catch { idxInfo = null; }
  drawIdx();
  setTimeout(idxPoll, idxInfo?.fase === 'indexando' || pdfWork.actual ? 2000 : 15000);
}
// Texto de la barra de estado sobre el índice: «Indexando N / M», el PDF que se está leyendo o «✓ Índice al día».
function drawIdx() {
  const E = $('#idx');
  if (!idxInfo) { E.textContent = ''; return; }
  const busy = idxInfo.fase === 'indexando' || pdfWork.actual;
  const text = idxInfo.fase === 'indexando' ? `Indexando ${idxInfo.hechos} / ${idxInfo.total}`
    : pdfWork.actual ? `Leyendo PDF · ${pdfWork.actual.split(/[\\/]/).pop()} · pág. ${pdfWork.pagina} / ${pdfWork.total}`
    : idxInfo.fase === 'error' ? 'Índice: error' : idxInfo.fase === 'esperando' ? 'Índice: preparando…'
    : `Índice al día · ${idxInfo.archivos} archivos`;
  E.innerHTML = `<span class="${busy ? 'spin' : ''}">${busy ? '⟳' : '✓'}</span> <span></span>`;
  E.lastChild.textContent = text;
  if ($('#dlg').open && $('#dlg').dataset.kind === 'idx') fillIdx();
}
$('#idx').onclick = () => {
  const d = $('#dlg');
  d.className = 'wide info'; d.oninput = d.onchange = null; d.dataset.kind = 'idx';
  d.onclose = () => { d.dataset.kind = ''; };
  fillIdx(); d.showModal();
};
// Contenido del modal del índice: estado, archivos por estado y por tipo, PDF pendientes y últimos errores.
function fillIdx() {
  const i = idxInfo || {}, d = $('#dlg'), fd = t => t ? new Date(t * 1000).toLocaleString() : '—';
  const est = i.por_estado || {}, pend = est.pdf_pendiente || 0;
  const row = (k, v) => `<dt>${esc(k)}</dt><dd>${v}</dd>`;
  d.innerHTML = `<b>Índice de búsqueda</b>
    <p class="ok">Se crea solo y en segundo plano. Si cierras Atril, sigue donde se quedó. Repasa cada 5 minutos solo lo que cambió.</p>
    <h4>Estado</h4><dl>
      ${row('Fase', esc(i.fase || '—'))}
      ${i.fase === 'indexando' ? row('Progreso', `<progress max="${i.total}" value="${i.hechos}"></progress> ${i.hechos} / ${i.total}`) : ''}
      ${row('Archivo actual', esc(i.actual || pdfWork.actual || '—'))}
      ${row('Última pasada', `${fd(i.inicio)} → ${fd(i.fin)}`)}
      ${row('PDF en lectura', pdfWork.actual ? esc(`${pdfWork.actual.split(/[\\/]/).pop()} · pág. ${pdfWork.pagina} / ${pdfWork.total}`) : 'ninguno')}
      ${row('PDF pendientes', pend)} ${row('Páginas de PDF leídas', i.pdf_paginas || 0)}
      ${row('Base de datos', `${fmtSize(i.tam_db || 0)} · historial\\indice.db`)}
    </dl>
    <h4>Archivos (${i.archivos || 0})</h4><dl>${Object.entries(est).map(([k, v]) => row(IDX_NAMES[k] || k, v)).join('')}</dl>
    <h4>Por tipo</h4><dl>${(i.por_tipo || []).map(([k, v]) => row(k, v)).join('')}</dl>
    ${(i.errores || []).length ? `<h4>Errores</h4><dl>${i.errores.map(([p, e]) => row(p.split(/[\\/]/).pop(), esc(e || ''))).join('')}</dl>` : ''}
    <div class="exp-actions"></div>`;
  d.lastChild.append(Object.assign(button('Cerrar', () => d.close()), { className: 'primary' }));

// Los PDF los lee la ventana con pdf.js (Python no puede sin instalar nada), uno a uno y sin acaparar
async function pdfWorker() {
  for (;;) {
    let next = null, lib = null;
    try { next = await api('/api/indice/pdf'); lib = next.ruta && await loadPdfJs(); } catch { next = null; }
    if (!next?.ruta || !lib) { pdfWork.actual = ''; await sleep(60000); continue; }
    Object.assign(pdfWork, { actual: next.ruta, pagina: 0, total: 0 });
    const paginas = []; let error = null;
    try {
      const doc = await lib.getDocument(raw(next.ruta)).promise;
      pdfWork.total = doc.numPages;
      for (let n = 1; n <= doc.numPages; n++) {
        pdfWork.pagina = n;
        if (n % 5 === 1) drawIdx();
        const tc = await (await doc.getPage(n)).getTextContent();
        paginas.push({ n, texto: tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('') });
        await sleep(15);
      }
      doc.destroy();
    } catch (e) { error = String(e?.message || e).slice(0, 300); }
    await api('/api/indice/pdf', { ruta: next.ruta, mtime: next.mtime, paginas, error }).catch(() => {});
    pdfWork.actual = ''; drawIdx();
  }
}

const OPTIONAL_IA = ['AGENTS.md', 'CLAUDE.md', 'GEMINI.md'];
// Aviso «Sin reglas / Sin bitácora»: crea reglas.md y bitacora.md (y AGENTS/CLAUDE/GEMINI.md si se marcan)
// desde plantillas/, con la descripción y la tecnología del proyecto ya rellenas.

  const d = $('#dlg');
  d.innerHTML = `<b></b>
    <label class="fld">Descripción <input id="tDesc" placeholder="Una frase: qué es el proyecto"></label>

  $('#tTec').value = info.tecnologia;
  const F = $('#tFiles');
  for (const a of info.archivos) {
    // AGENTS.md / CLAUDE.md / GEMINI.md: opcionales, solo sirven si se usa esa IA directamente en la carpeta del proyecto
    const optional = OPTIONAL_IA.includes(a.nombre);
    const note = a.existe ? 'ya existe → no se toca' : optional ? 'opcional: solo si usas esa IA dentro de la carpeta' : 'se creará';
    F.insertAdjacentHTML('beforeend', `<label class="frow"><input type="checkbox" value="${a.nombre}" ${a.existe ? 'disabled' : optional ? '' : 'checked'}>` +
      `<span>${a.nombre}</span><span class="ok">${note}</span></label>`);
  }
  $('#tNote').textContent = 'Atril solo necesita reglas.md y bitacora.md.';
  const fill = t => t.replaceAll('{{proyecto}}', info.proyecto)
    .replaceAll('{{descripcion}}', $('#tDesc').value.trim() || '(descripción)')
    .replaceAll('{{tecnologia}}', $('#tTec').value.trim() || 'sin definir')
    .replaceAll('{{fecha}}', new Date().toLocaleDateString('sv'));
  const selected = () => {
    const sel = [...F.querySelectorAll('input:checked')].map(i => i.value);

    if (sel.length) $('#tPrev').textContent = `Vista previa de ${sel[0]}:\n\n` + fill(info.plantillas[sel[0]]);
    $('#tOk').textContent = `Crear ${sel.length} archivo${sel.length === 1 ? '' : 's'}`;
    $('#tOk').disabled = !sel.length;

  };
  d.oninput = d.onchange = selected; selected();

  $('#tNo').onclick = () => d.close();
  $('#tOk').onclick = async () => {
    const r = await api('/api/plantilla', { ruta: p.ruta, archivos: selected(), descripcion: $('#tDesc').value, tecnologia: $('#tTec').value });
    d.close(); await loadSide();

    if (first) openTab(pjoin(p.ruta, first), true);
  };
  d.showModal(); $('#tDesc').focus();
}
// Aviso «Bitácora grande»: explica qué entradas se mueven a bitacora/AAAA.md y lo hace si se acepta.
async function archiveDialog(p) {
  const a = await api('/api/archivar?ruta=' + encodeURIComponent(p.ruta));
  const years = Object.entries(a.mover), total = years.reduce((s, [, n]) => s + n, 0);
  if (!total) return ask('Archivar bitácora', `bitacora.md tiene ${a.lineas} líneas, pero no hay entradas fechadas que mover: se conservan las ${a.quedan} más recientes.`, ['Entendido']);
  const msg = `bitacora.md tiene ${a.lineas} líneas.\nSe quedan las ${a.quedan} entradas más recientes.\nSe mueven ${total} entradas antiguas:\n` +
    years.map(([y, n]) => `   → bitacora/${y}.md   ${n} entrada${n === 1 ? '' : 's'}`).join('\n') + '\n\nSi esos archivos existen, se añaden. Nada se borra.';
  if (await ask('Archivar bitácora · ' + p.nombre, msg, ['Archivar', 'Cancelar']) !== 'Archivar') return;

// ---------- explorador para añadir proyectos y sueltos ----------
// Solo lista nombres; el contenido sigue siendo legible únicamente dentro de lo añadido.
// Tres columnas: lugares | lista de la carpeta (filtro, teclado) | qué se añade como proyecto y qué como sueltos.
let ex = null, exSel = null, exCur = 0;
const exFiles = new Map(); // ruta → elemento marcado (se conserva aunque se cambie de carpeta)
// Explorador «Añadir»: carga una carpeta (sin ruta: la última usada) y lo dibuja.
async function explore(ruta) {
  try { ex = await api('/api/explorar' + (ruta === undefined ? '' : '?ruta=' + encodeURIComponent(ruta))); }
  catch (e) { return ask('No se puede abrir esa carpeta', e.message, ['Entendido']); }
  exSel = null; exCur = 0; $('#expFind').value = ''; drawExplorer();
}
// Lo que se añadiría como proyecto: la carpeta seleccionada o, si no hay, la carpeta en la que se está
const exTarget = () => exSel || (ex.ruta ? { ruta: ex.ruta, nombre: ex.migas.at(-1)?.nombre, tipo: ex.tipo, avisos: ex.avisos, estado: ex.estado } : null);
const lowPath = r => r.toLowerCase().replace(/[\\/]+$/, '');
const projOf = r => ex.proyectos.filter(p => under(r, p.ruta)).sort((a, b) => b.ruta.length - a.ruta.length)[0];
const exShown = () => { const q = plainTxt($('#expFind').value.trim()); return ex.items.filter(i => !q || plainTxt(i.nombre).includes(q)); };
const EXT_TYPE = { xlsx: ['📊', 'Excel'], xls: ['📊', 'Excel'], csv: ['📊', 'CSV'], docx: ['📝', 'Word'], doc: ['📝', 'Word'],
  pdf: ['📕', 'PDF'], pptx: ['📽', 'PowerPoint'], png: ['🖼', 'Imagen'], jpg: ['🖼', 'Imagen'], jpeg: ['🖼', 'Imagen'],
  webp: ['🖼', 'Imagen'], gif: ['🖼', 'Imagen'], md: ['📄', 'Markdown'], txt: ['📄', 'Texto'], json: ['📄', 'JSON'],
  py: ['🐍', 'Python'], pyw: ['🐍', 'Python'], js: ['📄', 'JavaScript'], html: ['📄', 'HTML'], php: ['📄', 'PHP'],
  sql: ['📄', 'SQL'], bat: ['⚙', 'Script'], ps1: ['⚙', 'Script'], zip: ['🗜', 'Comprimido'] };
// Volver al árbol con el proyecto (y las carpetas hasta la ruta) desplegado
function revealInTree(ruta) {
  const p = projOf(ruta); if (!p) return;
  tree.set(p.ruta, true);
  let acc = p.ruta.replace(/[\\/]+$/, '');
  for (const part of ruta.slice(acc.length).split(/[\\/]/).filter(Boolean)) tree.set(acc = pjoin(acc, part), true);
  closeExplorer(); loadSide();
}

// Migas, lista y panel lateral del explorador «Añadir».
function drawExplorer() {
  const C = $('#crumbs'); C.innerHTML = '';
  C.append(button('Este equipo', () => explore('')));
  for (const m of ex.migas) { C.insertAdjacentHTML('beforeend', '<span>›</span>'); C.append(button(m.nombre.replace(/\\$/, ''), () => explore(m.ruta))); }
  C.scrollLeft = C.scrollWidth; // en rutas largas se ve el final
  $('#expUp').disabled = ex.padre === null;
  $('#expUp').onclick = () => explore(ex.padre);

  const P = $('#expPlaces'), here = lowPath(ex.ruta);
  const place = (icon, p) => { const a = document.createElement('a'); a.textContent = `${icon} ${p.nombre}`; a.title = p.ruta;
    a.classList.toggle('here', lowPath(p.ruta) === here); a.onclick = () => explore(p.ruta); return a; };
  P.innerHTML = '<h4>Lugares</h4>';
  P.append(...ex.lugares.map((p, n) => place(['🏠', '🖥', '📄', '⬇'][n] || '📁', p)));
  P.insertAdjacentHTML('beforeend', '<h4>Unidades</h4><div class="units"></div>');
  P.lastChild.append(...ex.unidades.map(u => button(u.replace('\\', ''), () => explore(u))));
  if (ex.proyectos.length) { P.insertAdjacentHTML('beforeend', '<h4>Proyectos en Atril</h4>'); P.append(...ex.proyectos.map(p => place('📁', p))); }

  drawExList(); drawExSide();
}

// Lista del explorador: carpetas y archivos con tipo y estado (añadido, dentro de un proyecto); la fila activa se mueve con el teclado.
function drawExList() {
  const L = $('#expList'), shown = exShown(), q = $('#expFind').value.trim();
  exCur = Math.min(exCur, Math.max(shown.length - 1, 0));
  L.innerHTML = '<div class="ehead"><span></span><span></span><span>Nombre</span><span>Tipo</span><span>Estado</span></div>';
  if (!shown.length) L.insertAdjacentHTML('beforeend', `<p class="ok" style="padding:8px">${ex.items.length ? `Nada coincide con «${esc(q)}» en esta carpeta.` : 'Carpeta vacía.'}</p>`);
  shown.forEach((i, n) => {
    const r = document.createElement('div'), [icon, type] = i.dir ? ['📁', i.tipo.join(' · ')] : kind(i.nombre).lock ? ['🔒', 'Sensible'] : EXT_TYPE[kind(i.nombre).ext] || ['📄', kind(i.nombre).ext.toUpperCase()];
    r.className = 'erow' + (i.atenuada ? ' dim' : '') + (exSel === i ? ' sel' : '') + (exFiles.has(i.ruta) ? ' chk' : '') + (n === exCur ? ' cur' : '');
    const state = i.estado === 'añadido' ? (i.dir ? 'proyecto' : 'suelto') : i.estado === 'dentro' ? 'en proyecto' : '';
    r.innerHTML = `${i.dir ? '<span></span>' : `<input type="checkbox" tabindex="-1" ${exFiles.has(i.ruta) ? 'checked' : ''}>`}<span>${icon}</span>
      <span class="n"></span><span class="et">${esc(type || '')}</span><span class="es">${state ? `<i>●</i> ${state}` : ''}</span>`;
    r.querySelector('.n').textContent = i.nombre;
    r.title = i.dir ? 'Un clic: elegir como proyecto · doble clic: entrar' : i.ruta;
    r.onclick = () => { exCur = n; exPick(i); };
    if (i.dir) r.ondblclick = () => explore(i.ruta);
    L.append(r);
  });
  L.querySelector('.cur')?.scrollIntoView({ block: 'nearest' });
}
// Carpeta: elegirla como proyecto. Archivo: marcarlo o desmarcarlo como suelto.
function exPick(i) {
  if (i.dir) exSel = exSel === i ? null : i;
  else exFiles.has(i.ruta) ? exFiles.delete(i.ruta) : exFiles.set(i.ruta, i);
  drawExList(); drawExSide();
}

// Panel derecho del explorador: añadir la carpeta como proyecto o los archivos marcados como sueltos.
function drawExSide() {
  const S = $('#expSide'), t = exTarget();
  const proj = document.createElement('section');
  proj.innerHTML = '<h4>Como proyecto</h4>';
  if (!t) proj.insertAdjacentHTML('beforeend', '<p class="ok">Elige una carpeta: un clic la selecciona, doble clic entra en ella.</p>');
  else {
    proj.insertAdjacentHTML('beforeend', `<div class="path">📁 ${esc(t.ruta)}</div>${t.tipo?.length ? `<p class="ok">${esc(t.tipo.join(' · '))}</p>` : ''}`);
    if (t.estado) {
      const p = projOf(t.ruta);
      proj.insertAdjacentHTML('beforeend', `<p>${t.estado === 'añadido' ? '✅ Ya es proyecto de Atril.' : `Está dentro del proyecto <b>${esc(p?.nombre || '')}</b>.`}</p>`);
      proj.append(button('Mostrar en el árbol', () => revealInTree(t.ruta)));
    } else {
      proj.insertAdjacentHTML('beforeend', `<p class="ok">${t.avisos.length ? t.avisos.map(a => '⚠️ ' + esc(a)).join('<br>') : '✅ Quedará en orden.'}</p>`);
      proj.append(Object.assign(button('Añadir proyecto', addProject), { className: 'primary' }));
    }
  }
  const files = [...exFiles.values()], fresh = files.filter(f => !f.estado), known = files.length - fresh.length;
  const loose = document.createElement('section');
  loose.innerHTML = `<h4>Archivos sueltos${files.length ? ` (${files.length})` : ''}</h4>`;
  if (!files.length) loose.insertAdjacentHTML('beforeend', '<p class="ok">Marca archivos de la lista para añadirlos sin su carpeta.</p>');
  else {
    const ul = document.createElement('ul'); ul.className = 'efiles';
    for (const f of files) {
      const li = document.createElement('li');
      li.innerHTML = `<span title="${esc(f.ruta)}"></span><b title="Quitar">✕</b>`;
      li.firstChild.textContent = f.nombre;
      li.lastChild.onclick = () => { exFiles.delete(f.ruta); drawExList(); drawExSide(); };
      ul.append(li);
    }
    loose.append(ul);
    if (known) loose.insertAdjacentHTML('beforeend', `<p class="ok">ⓘ ${known === files.length ? (known > 1 ? 'Ya están' : 'Ya está') : `${known} ya está${known > 1 ? 'n' : ''}`} en Atril: se ${known > 1 ? 'abren' : 'abre'}, no se ${known > 1 ? 'añaden' : 'añade'}.</p>`);
    const s = n => n > 1 ? 's' : '';
    loose.append(Object.assign(button(fresh.length ? `Añadir ${fresh.length} suelto${s(fresh.length)}` : `Abrir ${files.length} archivo${s(files.length)}`, addLoose), { className: 'primary' }));
  }
  S.replaceChildren(proj, loose);
}

// Añade la carpeta elegida como proyecto y la deja desplegada en el árbol.
async function addProject() {
  const t = exTarget();
  await api('/api/agregar', { tipo: 'proyectos', rutas: [t.ruta], ultima: ex.ruta });
  tree.set(t.ruta, true); closeExplorer(); loadSide();
}
// Añade los archivos marcados como sueltos (los que ya lo eran no se repiten) y los abre en pestañas.
async function addLoose() {
  const files = [...exFiles.values()], fresh = files.filter(f => !f.estado).map(f => f.ruta);
  if (fresh.length) await api('/api/agregar', { tipo: 'sueltos', rutas: fresh, ultima: ex.ruta });
  closeExplorer(); await loadSide(); files.forEach(f => openTab(f.ruta, true));
}

const openExplorer = () => { exFiles.clear(); $('#exp').hidden = false; explore().then(() => $('#expList').focus()); };
const closeExplorer = () => { $('#exp').hidden = true; };
$('#expClose').onclick = $('#expCancel').onclick = closeExplorer;
$('#expFind').oninput = () => { exCur = 0; drawExList(); };
addEventListener('keydown', e => {
  if ($('#exp').hidden) return;
  const find = $('#expFind'), inFind = e.target === find;
  if (e.key === 'Escape') { if (inFind && find.value) { find.value = ''; drawExList(); } else closeExplorer(); return; }
  if (inFind && !['ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) return;
  const shown = exShown(), i = shown[exCur];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); exCur = Math.max(0, Math.min(shown.length - 1, exCur + (e.key === 'ArrowDown' ? 1 : -1))); drawExList(); }
  else if (e.key === 'Enter' && i) { e.preventDefault(); i.dir ? explore(i.ruta) : exPick(i); }
  else if (e.key === ' ' && i && e.target.id === 'expList') { e.preventDefault(); exPick(i); }
  else if (e.key === 'Backspace' && ex.padre !== null && e.target.id === 'expList') { e.preventDefault(); explore(ex.padre); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && e.target.id === 'expList') find.focus(); // la letra cae en el filtro
});

// ---------- ajustes (⚙ en la cinta; se guardan en config.json) ----------
let AJ = {};
// Lee ⚙ Ajustes en AJ y aplica los que son CSS (tamaño de letra de documentos y de código).
async function loadSettings() {
  try { AJ = (await api('/api/ajustes')).valores; } catch { AJ = {}; }
  const r = document.documentElement.style;
  r.setProperty('--docFont', (AJ.letra_documento || 18) + 'px');
  r.setProperty('--codeFont', (AJ.letra_codigo || 13) + 'px');
}

  const inp = k => d.querySelector(`[data-k=${k}]`), find = d.querySelector('.sfind'), only = d.querySelector('.sonly input');

const copyText = (t, msg) => navigator.clipboard.writeText(t).catch(() => { // sin permiso del portapapeles: el método clásico
  const a = Object.assign(document.createElement('textarea'), { value: t, style: 'position:fixed;opacity:0' });
  (document.querySelector('dialog[open]') || document.body).append(a); a.select();
  const ok = document.execCommand('copy'); a.remove();
  if (!ok) throw new Error('sin portapapeles');
}).then(() => flash(msg || 'Copiado'), () => flash('No se pudo copiar: usa Ctrl+C'));

// ---------- pestañas ----------
let tabs = [], cur = null, showSrc = false, preview = false;
const edits = new Map(); // ruta → { f, text, orig, shown }: pestañas en modo edición (sobreviven al cambiar de pestaña)
const isDirty = e => e.text !== e.orig;
// Pestaña de vista previa (como VS Code): un clic abre el archivo en una pestaña en cursiva que el siguiente
// clic reemplaza. Se fija (deja de reemplazarse) con doble clic o en cuanto se modifica.
let previewTab = null;
try { ({ tabs, cur, previewTab = null } = JSON.parse(localStorage.getItem('atril.tabs')) || { tabs: [], cur: null }); } catch {}

// ---------- vista dividida ----------
// panes[i]: estado de cada lado. tabs/cur/previewTab (y editorCM, curFile, pdfCtl, findP) son siempre los del
// lado activo: activatePane() los guarda en su pane y carga los del otro sin volver a dibujar ninguno.
const panes = [{ el: paneEl }];
let active = 0, savedSplit = null; // savedSplit: se lee antes de que el arranque vuelva a guardar las pestañas
try { savedSplit = JSON.parse(localStorage.getItem('atril.split') || 'null'); } catch {}
const syncPane = () => {
  Object.assign(panes[active], { tabs, cur, previewTab });
  try { Object.assign(panes[active], { editorCM, curFile, pdfCtl, findP }); } catch {} // aún sin declarar mientras carga el script
};
const otherShows = path => panes.some((p, i) => i !== active && p.cur === path);
const persist = () => {
  syncPane();
  const st = p => ({ tabs: p.tabs, cur: p.cur, previewTab: p.previewTab });
  try {
    localStorage.setItem('atril.tabs', JSON.stringify(st(panes[0])));
    localStorage.setItem('atril.split', panes[1] ? JSON.stringify({ ...st(panes[1]), active }) : '');
  } catch {}
};
// Cambia el lado activo de la vista dividida: guarda tabs/cur/previewTab y el estado de su vista en su
// pane y carga los del otro, sin volver a dibujar (cada lado conserva su DOM). Si el lado mostraba un
// Word, imagen o PDF en edición cuyo estado ya es de otro archivo, ese lado se vuelve a dibujar.
function activatePane(i) {
  if (i === active || !panes[i]) return;
  syncPane();
  panes[active].el.classList.remove('on');
  active = i; paneEl = panes[i].el; paneEl.classList.add('on');
  ({ tabs, cur, previewTab } = panes[i]);
  editorCM = panes[i].editorCM || null; curFile = panes[i].curFile || null; pdfCtl = panes[i].pdfCtl || null;
  sel = null;
  const F = document.getElementById('find'); // el cuadro de buscar sigue al lado activo
  if (F && F.parentElement !== paneEl) { F.hidden = true; paneEl.append(F); }
  findP = panes[i].findP || null;
  // un Word/imagen/PDF que se editaba aquí y cuyo estado global pasó a otro archivo: se vuelve a dibujar
  const stale = (paneEl.querySelector('.wediting') && wedit?.path !== cur) || (paneEl.querySelector('.iedit') && iedit?.path !== cur)
    || (paneEl.querySelector('.ppage') && pedit?.path !== cur);
  persist(); markActive(); iaOnFile(); histBar();
  if (stale || panes[i].stale) { panes[i].stale = false; render(); }
}
// El DOM de un lado nuevo: sus #tabs, #bar y #view (los ids se repiten; $() busca primero en el activo).
function newPaneEl() {
  const el = document.createElement('div');
  el.className = 'pane';
  el.innerHTML = '<div id="tabs"></div><div id="bar"></div><div id="view"></div>';
  paneWire(el);
  return el;
}
// Un clic en cualquier parte de un lado lo activa antes de que el clic llegue a su destino.
// Soltar una pestaña del otro lado sobre la barra de pestañas la mueve aquí.
function paneWire(el) {
  el.addEventListener('pointerdown', () => activatePane(panes.findIndex(p => p.el === el)), true);
  const T = el.querySelector('#tabs');
  const from = e => e.dataTransfer.types.includes('text/atril-pane') && +e.dataTransfer.getData('text/atril-pane');
  T.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('text/atril-pane')) return;
    e.preventDefault(); T.classList.add('dropin');
  });
  T.addEventListener('dragleave', () => T.classList.remove('dropin'));
  T.addEventListener('drop', e => {
    T.classList.remove('dropin');
    const src = from(e), path = e.dataTransfer.getData('text/atril-path'), dst = panes.findIndex(p => p.el === el);
    if (src === false || src === dst || !path) return;
    e.preventDefault();
    moveTab(path, src, dst);
  });
}
paneWire(paneEl);
// la caja (y su iframe) de una pestaña web que se cierra o cambia de lado
function dropWebBox(path, el) { [...el.children].find(b => b.classList.contains('webbox') && b.dataset.path === path)?.remove(); }
// Pasa una pestaña de un lado al otro. Si era la que se veía, el origen muestra otra y termina de
// dibujarse antes de cambiar de lado; si no, el origen no se toca (una web abierta allí no se recarga).
async function moveTab(path, src, dst) {
  activatePane(src);
  if (!await askUnsaved(path)) return; // Word/imagen/PDF en edición: guardar o descartar antes de cambiar de lado
  endEdit([wedit, iedit, pedit].find(st => st?.path === path));
  dropWebBox(path, paneEl); // un iframe no se puede mover sin recargarse: en el otro lado se crea de nuevo
  const i = tabs.indexOf(path);
  tabs.splice(i, 1);
  if (previewTab === path) previewTab = null;
  if (cur === path) { // se iba la que se veía: el origen muestra otra, y termina de dibujarse antes de cambiar de lado
    cur = tabs[Math.min(i, tabs.length - 1)] ?? null;

// Notebook de Jupyter en lectura: celdas Markdown, código coloreado y salidas (texto e imágenes).
function notebookView(V, text, dir) {
  let nb; try { nb = JSON.parse(text); } catch { return codeView(V, text, 'json'); }
  const lang = nb.metadata?.kernelspec?.language || 'python', src = s => Array.isArray(s) ? s.join('') : s || '';
  let html = '';
  for (const c of nb.cells || []) {
    if (c.cell_type === 'markdown') { html += `<div class="cell">${marked.parse(src(c.source))}</div>`; continue; }
    html += `<div class="cell"><pre><code class="language-${lang}">${esc(src(c.source))}</code></pre>`;
    for (const o of c.outputs || []) {
      const d = o.data || {};
      if (o.text) html += `<div class="out"><pre>${esc(src(o.text))}</pre></div>`;
      else if (d['image/png']) html += `<div class="out"><img src="data:image/png;base64,${src(d['image/png']).trim()}"></div>`;
      else if (d['text/html']) html += `<div class="out">${src(d['text/html'])}</div>`;
      else if (d['text/plain']) html += `<div class="out"><pre>${esc(src(d['text/plain']))}</pre></div>`;
      else if (o.ename) html += `<div class="out"><pre>${esc(o.ename + ': ' + o.evalue)}</pre></div>`;
    }
    html += '</div>';
  }
  V.append(page(DOMPurify.sanitize(html), dir));
}
// Word en lectura con docx-preview (colores, fuentes y páginas como en Word); sin internet, mammoth.
// Editando se dibuja el Word del paso actual del historial y se activan la edición y el soltar imágenes.
async function docxView(V, f) {
  const s = curSeq(); // si mientras convierte se abre otra cosa, no se añade encima
  try {
    const node = wedit?.path === f.ruta && wedit.node; // editando: el Word tal como está en ese paso del historial
    const buf = await (await fetch(node ? `/api/hist/docx?ruta=${encodeURIComponent(f.ruta)}&id=${node}` : raw(f.ruta), { cache: 'no-store' })).arrayBuffer();
    if (!live(s)) return;
    if (window.docx?.renderAsync) { // como en Word: colores, fuentes, tamaños y páginas
      const box = document.createElement('div'); box.className = 'docxbox';
      V.className = 'flush'; V.append(box);
      await docx.renderAsync(buf, box, null, { className: 'docx', inWrapper: true, breakPages: true,
        ignoreLastRenderedPageBreak: true, renderHeaders: true, renderFooters: true, experimental: true });
      docxDrop(box, f.ruta); // soltar una imagen sobre un párrafo la inserta ahí
      if (wedit?.path === f.ruta && live(s)) await wordEditable(box, f.ruta);
      return;
    }
    if (wedit?.path === f.ruta) { wedit = null; ask('Editar Word', 'Para editar hace falta el visor de Word, que se carga de internet. Sin conexión solo se puede leer.', ['Entendido']); }
    const { value } = await mammoth.convertToHtml({ arrayBuffer: buf }); // reserva sin internet: sin colores
    if (live(s)) V.append(page(DOMPurify.sanitize(value), ''));
  } catch (e) { if (live(s)) card(V, f); }
}
// ---------- editar un Word a mano: texto y formato básico sobre la vista; se guarda como cambios por párrafo ----------
// Cada <p> del visor se empareja con su w:p del archivo (mismo texto, en orden); los que no casan (encabezados,
// tabulaciones, campos) quedan de solo lectura. Al guardar, el texto cambiado y los B/I/U/color van a /api/docx.
let wedit = null; // { path, mtime, node (paso del historial que se ve; null = el archivo), ps: [{ el, i, base }], dirty }
const WCOLORS = [['Rojo', 'FF0000'], ['Azul', '0070C0'], ['Verde', '00B050'], ['Naranja', 'FFA500'], ['Morado', '7030A0'], ['Negro', '000000']];
function wordEdit(path) { pinTab(path); wedit = { path, node: null, fresh: true, dirty: false }; render(); }
// empareja cada <p> del visor con su w:p (mismo texto, en orden); los que no casan quedan fuera
async function docxMap(box, path, node) {
  const { parrafos, mtime } = node ? { parrafos: await api(`/api/hist/parrafos?ruta=${encodeURIComponent(path)}&id=${node}`) }
    : await api('/api/docx/parrafos?ruta=' + encodeURIComponent(path)), ps = [], fuera = [];
  let j = 0;
  for (const el of box.querySelectorAll('section.docx p')) {
    if (el.closest('header, footer')) continue;
    const t = el.textContent.normalize('NFC');
    let k = -1;
    for (let x = j; x < Math.min(parrafos.length, j + (t ? 8 : 1)); x++) if (parrafos[x] === t) { k = x; break; }
    if (k < 0) { fuera.push(el); continue; }
    j = k + 1;
    ps.push({ el, i: k, base: t });
  }
  return { ps, fuera, mtime };
}
// Convierte los párrafos emparejados en editables (contentEditable) y conecta: historial (un paso tras
// cada pausa), Enter bloqueado (párrafos nuevos → IA), pegar solo texto y Ctrl+B/I/U.
async function wordEditable(box, path) {
  const { ps, fuera, mtime } = await docxMap(box, path, wedit.node);
  Object.assign(wedit, { ps }, wedit.node ? {} : { mtime });
  const h = await histUse(path, async id => { // ↶ ↷: se vuelve a dibujar el Word de ese paso
    const hh = hists.get(path);
    Object.assign(wedit, { node: id, dirty: id !== hh.disco, saved: false }); render();
  }, wedit.fresh);
  wedit.fresh = false; h.flush = wordStep;
  for (const el of fuera) { el.classList.add('wro'); el.title = 'Este párrafo no se puede editar aquí (pídeselo a la IA)'; }
  for (const { el } of ps) { el.contentEditable = 'true'; el.spellcheck = true; el.classList.add('wed'); }
  box.classList.add('wediting');
  box.addEventListener('input', () => { wordDirty(); clearTimeout(wedit.t); wedit.t = setTimeout(wordStep, (AJ.historial_pausa_seg || 2) * 1000); });
  box.addEventListener('keydown', e => {
    const key = e.ctrlKey && !e.altKey && { b: 'negrita', i: 'cursiva', u: 'subrayado' }[e.key.toLowerCase()];
    if (e.key === 'Enter') { e.preventDefault(); flash('Párrafos nuevos: pídeselo a la IA'); }
    if (key) { e.preventDefault(); e.stopPropagation(); wordFormat(key); } // Ctrl+B aquí es negrita, no la barra lateral
  });
  box.addEventListener('paste', e => { // solo texto, en una línea
    e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain').replace(/\s*\n\s*/g, ' '));
  });
  if (!wedit.ps.length) flash('Ningún párrafo de este Word se puede editar aquí');
}
function wordFlush() { // el texto tecleado → cambios {parrafo, desde, buscar, reemplazar}
  const ops = [];
  for (const p of wedit.ps) {
    const now = p.el.textContent.normalize('NFC'), old = p.base;
    if (now === old) continue;
    if (!old) ops.push({ parrafo: p.i, agregar: now });
    else {
      let a = 0, s = 0;
      while (a < old.length && a < now.length && old[a] === now[a]) a++;
      while (s < old.length - a && s < now.length - a && old[old.length - 1 - s] === now[now.length - 1 - s]) s++;
      if (a + s === old.length) a ? a-- : s--; // solo se añadió texto: se incluye un carácter vecino para poder buscarlo
      ops.push({ parrafo: p.i, desde: a, buscar: old.slice(a, old.length - s), reemplazar: now.slice(a, now.length - s) });
    }
    p.base = now;
  }
  return ops;
}
// lo escrito desde el último paso → un paso del historial
function wordStep() {
  if (!wedit) return Promise.resolve();
  clearTimeout(wedit.t);
  const path = wedit.path, ops = wordFlush();
  if (!ops.length) return hists.get(path)?.cola || Promise.resolve();
  const p = wedit.ps.find(x => x.i === ops[0].parrafo), t = p ? p.base.trim().slice(0, 50) : '';
  return histStep(path, `✎ Texto${t ? ': ' + t : ''}`, b64txt(JSON.stringify(ops)));
}
// Negrita, cursiva, subrayado o color sobre la selección (dentro de un párrafo): se ve al momento con
// execCommand y queda como paso del historial {parrafo, desde, buscar, …} que el servidor aplica al guardar.
function wordFormat(key, color) {
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed) return flash('Selecciona primero el texto');
  const r = s.getRangeAt(0), p = wedit?.ps.find(x => x.el.contains(r.startContainer));
  if (!p || !p.el.contains(r.endContainer)) return flash('Selecciona texto dentro de un mismo párrafo');
  wordStep();
  const pre = document.createRange(); pre.setStart(p.el, 0); pre.setEnd(r.startContainer, r.startOffset);
  const cmd = { negrita: 'bold', cursiva: 'italic', subrayado: 'underline', color: 'foreColor' }[key];
  const op = { parrafo: p.i, desde: pre.toString().normalize('NFC').length, buscar: r.toString().normalize('NFC') };
  op[key] = color ?? !document.queryCommandState(cmd);
  const nom = { negrita: '𝐁 Negrita', cursiva: '𝐼 Cursiva', subrayado: 'U̲ Subrayado', color: '🎨 Color' }[key];
  histStep(wedit.path, `${nom}${typeof op[key] === 'boolean' && !op[key] ? ' (quitar)' : ''}${color ? ' ' + (WCOLORS.find(c => c[1] === color)?.[0] || color) : ''}: «${op.buscar.slice(0, 40)}»`,
    b64txt(JSON.stringify([op])));
  document.execCommand('styleWithCSS', false, true); document.execCommand(cmd, false, color && '#' + color); // se ve al momento
  wordDirty();
}
function wordDirty() { // el botón dice siempre en qué estado está el Word
  wedit.dirty = true; wedit.saved = false;
  const b = $('#wsave'); if (b) Object.assign(b, { disabled: false, textContent: 'Guardar ●' });
}
// Soltar una imagen (del árbol, una pestaña, el visor o Windows) sobre un párrafo: va antes o después según la mitad
function docxDrop(box, path) {
  const target = e => e.target.closest?.('section.docx p:not(header p):not(footer p)');
  const mark = (p, after) => { box.querySelectorAll('.pdrop-a,.pdrop-d').forEach(x => x.classList.remove('pdrop-a', 'pdrop-d')); p?.classList.add(after ? 'pdrop-d' : 'pdrop-a'); };
  const half = (p, e) => { const r = p.getBoundingClientRect(); return e.clientY > r.top + r.height / 2; };
  box.addEventListener('dragover', e => {
    const p = target(e); if (!p) return;
    e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'copy'; mark(p, half(p, e));
  });
  box.addEventListener('dragleave', e => { if (!box.contains(e.relatedTarget)) mark(null); });
  box.addEventListener('drop', async e => {
    const p = target(e); mark(null);
    e.preventDefault(); e.stopPropagation();
    if (!p) return flash('Suelta la imagen sobre un párrafo del documento');
    const uri = e.dataTransfer.getData('text/uri-list'), own = uri.match(/^https?:\/\/[^/]+\/raw\/(.+)$/);
    const ruta = e.dataTransfer.getData('text/atril-path') || (own ? rawPath(own[1]) : '');
    const file = !ruta && e.dataTransfer.files[0], nombre = ruta ? ruta.split(/[\\/]/).pop() : file?.name || '';
    if (!/\.(png|jpe?g|gif|bmp)$/i.test(nombre)) return ask('Insertar imagen', nombre
      ? `«${nombre}» no es una imagen que Word admita: suelta un .png, .jpg, .gif o .bmp.` : 'Suelta un archivo de imagen (.png, .jpg, .gif o .bmp).', ['Entendido']);
    const op = { imagen: ruta || nombre, posicion: half(p, e) ? 'despues' : 'antes', buscar: '' };
    if (file) op.datos = await b64(file);
    if (wedit?.path === path) { // editando: la imagen es un paso más (se guarda con Guardar)
      const w = wedit.ps.find(x => x.el === p);
      if (!w) return ask('Insertar imagen', 'Ese párrafo no se puede usar aquí: suéltala sobre otro.', ['Entendido']);
      await wordStep();
      const id = await histStep(path, `🖼 Imagen ${op.posicion === 'antes' ? 'antes de' : 'después de'} «${w.base.trim().slice(0, 30)}»: ${nombre}`,
        b64txt(JSON.stringify([{ ...op, parrafo: w.i }])));
      if (id) { wordDirty(); hists.get(path).restore(id); }
      return;
    }
    const { ps, mtime } = await docxMap(box, path), w = ps.find(x => x.el === p);
    if (!w) return ask('Insertar imagen', 'Ese párrafo no se puede usar aquí: suéltala sobre otro.', ['Entendido']);
    await applyDocx(path, [{ ...op, parrafo: w.i }], mtime);
  });
}
// Guardar = escribir en el archivo el Word del paso actual del historial (aunque sea uno de antes de otro guardado)
async function wordSave() {
  const path = wedit.path;
  await wordStep();
  const h = hists.get(path);
  if (!h?.actual || h.actual === h.disco) return flash('No hay cambios');
  try {
    const r = await api('/api/hist/escribir', { ruta: path, id: h.actual, mtime: wedit.mtime });
    Object.assign(h, { nodos: r.nodos, disco: r.disco });
    Object.assign(wedit, { node: null, mtime: r.mtime, dirty: false, saved: true, last: r.deshacer });
    textCache.delete(path); histBar(); render();
    flash('✓ Guardado en el Word' + (r.bak ? ' · respaldo: ' + r.bak.split(/[\\/]/).pop() : ''));
  } catch (e) { ask('No se guardó', e.message, ['Entendido']); }
}
async function wordLeave() {
  if (wedit && await askUnsaved(wedit.path)) { wedit = null; render(); }
}
// ---------- editar una imagen: cada paso es un lienzo nuevo y queda en el historial (PNG + brillo y contraste) ----------
const EDIT_IMG = set('png jpg jpeg webp');
let iedit = null; // { path, mtime, cv, b, c, dirty, saved, last }
function imageEdit(path) { pinTab(path); iedit = { path, fresh: true, b: 100, c: 100, dirty: false }; render(); }
// Editor de imagen: barra (girar, voltear, recortar, ancho, brillo, contraste) y el lienzo. Cada cambio es
// un lienzo nuevo y un paso del historial (PNG + brillo y contraste); brillo y contraste se aplican al guardar.
async function imageEditView(V, f) {
  const s = curSeq();
  if (!iedit.cv) { // primera vez: la imagen del disco en un lienzo
    const img = new Image(); img.src = raw(f.ruta) + '?v=' + f.mtime;
    try { await img.decode(); } catch { iedit = null; return ask('Editar imagen', 'No se pudo abrir la imagen.', ['Entendido']); }
    iedit.cv = canvasOf(img, img.naturalWidth, img.naturalHeight); iedit.mtime = f.mtime;
  }
  await histUse(f.ruta, async id => { // ↶ ↷: la imagen de ese paso con su brillo y contraste
    const img = new Image(); img.src = histUrl(f.ruta, id);
    await img.decode();
    const n = histNode(hists.get(f.ruta), id);
    Object.assign(iedit, { cv: canvasOf(img, img.naturalWidth, img.naturalHeight), b: n?.b ?? 100, c: n?.c ?? 100,
      dirty: id !== hists.get(f.ruta).disco, saved: false });
    render();
  }, iedit.fresh);
  iedit.fresh = false;
  if (!live(s)) return;
  V.insertAdjacentHTML('beforeend', `<div class="iedit"><div class="itools">
    <button data-a="l" title="Girar a la izquierda">⟲</button><button data-a="r" title="Girar a la derecha">⟳</button>
    <button data-a="h" title="Voltear horizontal">↔</button><button data-a="v" title="Voltear vertical">↕</button>
    <button data-a="crop" title="Recortar: arrastra sobre la imagen">✂ Recortar</button>
    <label title="Ancho en píxeles (el alto se ajusta solo)">Ancho <input type="number" min="1" id="iw"> px</label>
    <label>☀ <input type="range" min="0" max="200" id="ib"></label><label>◐ <input type="range" min="0" max="200" id="ic"></label>
    <span class="ok" id="iinfo"></span></div>
    <div class="istage"><div class="iwrap"></div></div></div>`);
  const T = V.querySelector('.itools'), W = V.querySelector('.iwrap');
  const show = () => {
    W.innerHTML = ''; W.append(iedit.cv);
    iedit.cv.style.filter = `brightness(${iedit.b}%) contrast(${iedit.c}%)`;
    $('#iw').value = iedit.cv.width; $('#ib').value = iedit.b; $('#ic').value = iedit.c;
    $('#iinfo').textContent = `${iedit.cv.width} × ${iedit.cv.height} px`;
  };
  const record = desc => histStep(iedit.path, desc, iedit.cv.toDataURL('image/png').split(',')[1], { b: iedit.b, c: iedit.c });
  const step = (cv, desc) => { iedit.cv = cv; imageDirty(); show(); record(desc); };
  const turn = (w, h, fn) => { const cv = canvasOf(null, w, h), g = cv.getContext('2d'); fn(g); g.drawImage(iedit.cv, 0, 0); return cv; };
  T.onclick = e => {
    const a = e.target.dataset?.a, { width: w, height: h } = iedit.cv;
    if (a === 'l') step(turn(h, w, g => { g.translate(0, w); g.rotate(-Math.PI / 2); }), '⟲ Girar a la izquierda');
    if (a === 'r') step(turn(h, w, g => { g.translate(h, 0); g.rotate(Math.PI / 2); }), '⟳ Girar a la derecha');
    if (a === 'h') step(turn(w, h, g => { g.translate(w, 0); g.scale(-1, 1); }), '↔ Voltear horizontal');
    if (a === 'v') step(turn(w, h, g => { g.translate(0, h); g.scale(1, -1); }), '↕ Voltear vertical');
    if (a === 'crop') cropMode(W, rect => step(canvasOf(iedit.cv, rect.w, rect.h, rect), `✂ Recortar a ${rect.w} × ${rect.h} px`));
  };
  $('#iw').onchange = e => {

  };
  // brillo y contraste: se ve al mover; el paso se guarda al soltar

  $('#ic').oninput = e => { iedit.c = +e.target.value; imageDirty(); show(); };
  $('#ib').onchange = () => record(`☀ Brillo ${iedit.b} %`); $('#ic').onchange = () => record(`◐ Contraste ${iedit.c} %`);
  $('#ib').ondblclick = () => { iedit.b = 100; show(); record('☀ Brillo 100 %'); }; $('#ic').ondblclick = () => { iedit.c = 100; show(); record('◐ Contraste 100 %'); };
  show();
}
// lienzo con src (imagen o lienzo) dibujado a w×h; crop: {x, y, w, h} de src que se toma
function canvasOf(src, w, h, crop) {
  const cv = Object.assign(document.createElement('canvas'), { width: w, height: h });
  if (src) {
    const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high';
    crop ? g.drawImage(src, crop.x, crop.y, crop.w, crop.h, 0, 0, w, h) : g.drawImage(src, 0, 0, w, h);
  }
  return cv;
}
// Recortar: se arrastra un rectángulo sobre el lienzo (en píxeles reales de la imagen) y ✓ lo aplica.
function cropMode(W, done) {
  const cv = iedit.cv, box = Object.assign(document.createElement('div'), { className: 'icrop' });
  const bar = Object.assign(document.createElement('div'), { className: 'icropbar', innerHTML: '<span>Arrastra para elegir la zona · </span>' });
  let r = null;
  const end = () => { box.remove(); bar.remove(); cv.onpointerdown = cv.onpointermove = null; };
  const ok = button('✓ Recortar', () => { if (r && r.w > 1 && r.h > 1) { end(); done(r); } else flash('Arrastra primero sobre la imagen'); });
  const no = button('Cancelar', end);
  ok.className = 'primary small'; no.className = 'small'; bar.append(ok, no);
  W.append(box); W.closest('.iedit').querySelector('.itools').after(bar);
  cv.onpointerdown = e => {
    const k = cv.width / cv.getBoundingClientRect().width, o = cv.getBoundingClientRect();
    const x0 = (e.clientX - o.left) * k, y0 = (e.clientY - o.top) * k;
    cv.setPointerCapture(e.pointerId);
    cv.onpointermove = m => {
      const x1 = Math.min(cv.width, Math.max(0, (m.clientX - o.left) * k)), y1 = Math.min(cv.height, Math.max(0, (m.clientY - o.top) * k));
      r = { x: Math.round(Math.min(x0, x1)), y: Math.round(Math.min(y0, y1)), w: Math.round(Math.abs(x1 - x0)), h: Math.round(Math.abs(y1 - y0)) };
      Object.assign(box.style, { left: r.x / k + 'px', top: r.y / k + 'px', width: r.w / k + 'px', height: r.h / k + 'px', display: 'block' });
      bar.firstChild.textContent = `${r.w} × ${r.h} px · `;
    };
    cv.onpointerup = () => { cv.onpointermove = null; };
  };
}

// Guarda la imagen en su formato con brillo y contraste aplicados (JPEG sobre fondo blanco) y marca el paso como guardado.
async function imageSave() {
  if (!iedit?.dirty) return flash('No hay cambios');
  const ext = kind(iedit.path).ext, type = ext === 'png' ? 'image/png' : ext === 'webp' ? 'image/webp' : 'image/jpeg';
  const out = canvasOf(null, iedit.cv.width, iedit.cv.height), g = out.getContext('2d');
  if (type === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height); } // JPEG no tiene transparencia
  g.filter = `brightness(${iedit.b}%) contrast(${iedit.c}%)`; g.drawImage(iedit.cv, 0, 0);
  try {
    const blob = await new Promise(ok => out.toBlob(ok, type, .92));
    const r = await api('/api/binario', { ruta: iedit.path, datos: await b64(blob), mtime: iedit.mtime });
    // lo guardado pasa a ser el punto de partida (brillo y contraste ya van dentro)
    Object.assign(iedit, { cv: out, b: 100, c: 100, dirty: false, saved: true, last: r.deshacer, mtime: r.mtime });
    await histSaved(iedit.path); // 💾 en el historial
    textCache.delete(iedit.path); render();
    flash('✓ Imagen guardada' + (r.bak ? ' · respaldo: ' + r.bak.split(/[\\/]/).pop() : ''));
  } catch (e) { ask('No se guardó', e.message, ['Entendido']); }
}
// ---------- visor de PDF propio (pdf.js): Atril sabe en qué página estás; el visor de Edge no lo dice ----------
const edgePdf = new Set(); // PDFs que se ven con el visor de Edge (⋮), hasta cerrar Atril

function pdfAt(path, n) { // última página vista de cada PDF (se recuerda entre sesiones)
  pdfAtMap ||= (() => { try { return JSON.parse(LS('atril.pdfpag') || '{}'); } catch { return {}; } })();
  if (n === undefined) return pdfAtMap[path] || 1;

// ---------- consola: ejecutar archivos y pruebas ----------
const noAsk = new Set(); // "no volver a preguntar" (hasta cerrar Atril)

// Confirmación antes de ejecutar: la orden (editable para las pruebas), la carpeta y «no volver a preguntar».

async function runFile(path, f) {
  const ed = edits.get(path);
  if (ed && isDirty(ed)) {
    if (await ask('Cambios sin guardar', `Guarda "${f.nombre}" antes de ejecutarlo.`, ['Guardar y ejecutar', 'Cancelar']) !== 'Guardar y ejecutar') return;
    await save(path); if (isDirty(ed)) return;
  }
  if (!noAsk.has(path)) {
    const r = await runDialog('Ejecutar ' + f.nombre, f.ejecutar.texto, f.ejecutar.carpeta, false);
    if (!r) return;
    if (r.skip) noAsk.add(path);
  }
  const again = () => api('/api/ejecutar', { ruta: path });
  launch(again, f.nombre, f.ejecutar.texto, f.ejecutar.carpeta, path);

// Arranca un proceso en el servidor y crea su pestaña en la consola; poll() va trayendo la salida.
async function launch(start, label, cmd, cwd, ruta, onDone = null) {
  let res;
  try { res = await start(); } catch (e) { return ask('No se pudo ejecutar', e.message, ['Entendido']); }
  const r = { id: res.id, label, cmd, cwd, ruta, onDone, again: start, trozos: [], fin: false, codigo: null, dur: 0 };
  runsUI.push(r); curRun = r; showPanel(true); drawRuns(); poll(r);
}
// Trae la salida nueva de un proceso cada 300 ms hasta que termina; al final llama a onDone (p. ej. «Explicar error»).
async function poll(r) {
  while (!r.fin) {
    try {
      const d = await api(`/api/salida?id=${r.id}&desde=${r.trozos.length}`);
      r.trozos.push(...d.trozos); Object.assign(r, { fin: d.fin, codigo: d.codigo, dur: d.dur });
      if (r === curRun) { appendOut(d.trozos); drawRunBar(); }
      if (r.fin) drawRunTabs();
    } catch { r.fin = true; drawRuns(); }
    if (!r.fin) await new Promise(ok => setTimeout(ok, 300));
  }
  r.onDone?.(r);

}
// "página 40", "páginas 27 a 35", "pág. 27-30", "página 27 en adelante" (10 páginas). Numeración del visor de PDF.
function parsePages(t) {
  const m = plainTxt(t).match(/\bpag(?:ina)?s?\.?\s*(\d+)(?:\s*(?:a|al|hasta|-|–|y)\s*(?:la\s+)?(?:pag(?:ina)?\.?\s*)?(\d+)|\s+(en adelante))?/);
  if (!m) return null;
  const a = +m[1], b = m[2] ? +m[2] : m[3] ? a + (AJ.ia_pdf_en_adelante || 10) - 1 : a, lo = Math.min(a, b);
  return [lo, Math.min(Math.max(a, b), lo + (AJ.ia_pdf_max_paginas || 50) - 1)];
}
const rkey = c => c.ruta || c.nombre;
const sentKey = (nombre, desc, tokens) => kind(nombre).ext === 'pdf' ? `${nombre}|${desc}` : `${nombre}|${desc}|${tokens}`;
const cachedText = ruta => {
  if (!textCache.has(ruta)) textCache.set(ruta, api('/api/extraer?ruta=' + encodeURIComponent(ruta)).catch(e => ({ error: e.message })));
  return textCache.get(ruta);
};

let ctxTimer = 0, ctxSeq = 0;
function iaRefresh() { clearTimeout(ctxTimer); ctxTimer = setTimeout(buildContext, 350); }
// «Se enviará»: el archivo abierto, los nombrados en el mensaje, las páginas pedidas de un PDF, la selección
// y lo soltado, con sus tokens. Las peticiones que llegan tarde (otro mensaje ya escrito) se descartan.
async function buildContext(msgText) { // msgText: al enviar, el cuadro ya está vacío
  if (!document.body.classList.contains('ia')) return ctx;
  const seq = ++ctxSeq, msg = msgText ?? $('#convQ').value, pages = parsePages(msg), items = [];
  const add = it => { if (!items.some(i => i.ruta === it.ruta)) items.push(it); };
  if (curFile?.ruta) add({ ruta: curFile.ruta, nombre: curFile.nombre, abierto: true });
  if (msg.trim()) for (const f of await api('/api/contexto', { mensaje: msg, ruta: curFile?.ruta || conv?.proyecto || '' }).catch(() => [])) add(f);
  manual.forEach(add);
  const sent = new Set((conv?.adjuntos || []).map(a => sentKey(a.nombre, a.desc, a.tokens))), out = [];
  const selTxt = selectedText();
  if (selTxt && curFile) out.push({ nombre: 'Texto seleccionado', desc: curFile.nombre, texto: selTxt, tokens: Math.ceil(selTxt.length / 4) });
  for (const it of items) {
    const k = kind(it.nombre), c = { ...it, desc: '', tokens: 0 };
    if (k.lock && AJ.ia_permitir_sensibles === false) c.aviso = '🔒 sensible: desactivado en ⚙ Ajustes';
    else if (k.ext === 'pdf') {
      // un PDF soltado trae sus páginas; si no, las del mensaje; si no se nombran, la que se ve en pantalla
      const pg = it.pages || pages || (it.abierto && [pdfAt(it.ruta), pdfAt(it.ruta)]);
      if (!pg) c.aviso = 'di qué páginas: «página 40» o «páginas 27 a 35»';
      else Object.assign(c, { pages: pg, desc: pg[0] === pg[1] ? `pág. ${pg[0]}` : `págs. ${pg[0]}–${pg[1]}`, tokens: (pg[1] - pg[0] + 1) * 600, aprox: true });
    } else if (it.abierto && curFile.texto !== null) {
      c.texto = srcText(); c.tokens = Math.ceil(c.texto.length / 4);
    } else {
      const r = await cachedText(it.ruta);
      if (r.error) c.aviso = r.error;
      else Object.assign(c, { texto: r.texto, tokens: r.tokens, ref: r.ref, imagen: r.imagen, desc: r.ref ? 'referencia' : '' });
    }
    if (c.imagen && seeImg.has(rkey(c))) Object.assign(c, { ver: true, tokens: c.tokens + IMG_TOK });
    if (!c.aviso && sent.has(sentKey(c.nombre, c.desc, c.tokens))) c.enviado = true;
    if (removed.has(rkey(c))) c.quitado = true;
    out.push(c);
  }
  if (seq !== ctxSeq) return ctx;
  ctx = out; drawCtx();
  return ctx;
}
const toSendList = () => [...ctx.filter(c => !c.aviso && !c.enviado && !c.quitado), ...dropped, ...(consoleCtx ? [consoleCtx] : [])];
// Dibuja «Se enviará»: cada adjunto con sus tokens, ✕ para quitarlo, 👁 en imágenes y los avisos con su nombre.

      (c.imagen && toggle && !c.quitado ? `<i class="eye${c.ver ? ' on' : ''}" title="${c.ver ? 'Enviar solo el nombre' : `Que la IA vea la imagen (≈ ${IMG_TOK} tokens; solo Claude)`}">👁</i>` : '') +
      (toggle ? `<b title="${c.quitado ? 'Volver a incluir' : 'No enviar'}">${c.quitado ? '↺' : '✕'}</b>` : '');

// PDF: el texto de las páginas pedidas se extrae aquí con pdf.js (nunca el libro entero)
let pdfjsReady = null;
const loadPdfJs = () => pdfjsReady ||= new Promise((ok, fail) => {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
  s.onerror = () => { pdfjsReady = null; fail(new Error('No se pudo cargar el lector de PDF (¿sin internet?)')); };

});
async function pdfPages(ruta, a, b) {
  return pdfText(await (await loadPdfJs()).getDocument(raw(ruta)).promise, a, b);
}
async function pdfText(doc, a, b) { // doc: PDF ya abierto (de una ruta de Atril o de un archivo soltado)
  if (a > doc.numPages) throw new Error(`El PDF solo tiene ${doc.numPages} páginas`);
  let out = '';
  for (let i = a; i <= Math.min(b, doc.numPages); i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    out += `\n\n[Página ${i}]\n` + tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+\n/g, '\n');
  }
  if (!out.replace(/\[Página \d+\]/g, '').trim()) throw new Error('Esas páginas del PDF no tienen texto (¿es escaneado?)');
  return out.trim();
}

// Respuesta: texto + archivos pedidos (<<<ARCHIVO …ARCHIVO>>>) + cambios al archivo abierto (BUSCAR/REEMPLAZAR)
const FILE_RE = /<<<ARCHIVO[ \t]+([^\n]+)\n([\s\S]*?)\n?ARCHIVO>>>/g;
const EDIT_RE = /<<<<<<< BUSCAR\n[\s\S]*?>>>>>>> REEMPLAZAR\n?/g;
const replyFiles = t => [...t.matchAll(FILE_RE)].map(x => ({ nombre: x[1].trim(), texto: x[2] }));
const DOCX_RE = /<<<DOCX\s*([\s\S]*?)\s*DOCX>>>/g;

function replyDocx(t) {
  const ops = [];

}
// Texto legible de un cambio propuesto para Word, p. ej. «Título»: color rojo, negrita · 🖼 portada.png después de «…».
function describeOp(o) {
  if (o.error) return `⚠ bloque ilegible: ${o.error.slice(0, 60)}`;
  if (o.imagen) return `🖼 ${String(o.imagen).split(/[\\/]/).pop()} ${o.posicion === 'antes' ? 'antes de' : 'después de'} «${o.buscar}»` + (o.ancho_cm ? ` · ${o.ancho_cm} cm` : '');
  const parts = [];
  if (o.reemplazar !== undefined) parts.push(`texto → «${o.reemplazar}»`);
  if (o.color) parts.push(`color ${o.color}`);
  for (const [k, n] of [['negrita', 'negrita'], ['cursiva', 'cursiva'], ['subrayado', 'subrayado']]) if (k in o) parts.push((o[k] ? '' : 'sin ') + n);
  if (o.tamano) parts.push(`${o.tamano} pt`);
  if (o.resaltado) parts.push(`resaltado ${o.resaltado}`);
  if (o.fuente) parts.push(`fuente ${o.fuente}`);
  return `«${o.buscar}»${o.todas ? ' (todas)' : ''}: ${parts.join(', ') || 'sin cambios'}`;
}
async function applyDocx(ruta, ops, mtime) { // mtime: edición a mano (falla si el Word cambió en disco mientras tanto)

// Crea el archivo que propone la IA (<<<ARCHIVO …>>>) en la carpeta del proyecto, sin pisar uno existente (nombre-2…).
async function makeFile(f, auto) {

  if (!folder) return ask('Crear archivo', 'Abre un archivo del proyecto: el nuevo se crea en su carpeta.', ['Entendido']);
  const base = f.nombre.replace(/[\\/:*?"<>|]/g, '_');
  let name = base;
  for (let i = 2; i < 50; i++) {

      const conv2 = /\.(docx|pdf)$/i.test(name) ? DOMPurify.sanitize(marked.parse(f.texto)) : undefined;
      const r = await api('/api/crear', { carpeta: folder, nombre: name, texto: f.texto, html: conv2 });

// Aplica bloques BUSCAR/REEMPLAZAR de la IA al archivo abierto en el editor (sin guardar: se revisa y se guarda).
async function applyEditBlocks(ruta, blocks) {
  if (!ruta) { ask('Aplicar cambios', 'Este mensaje no tenía un archivo abierto al que aplicar los cambios.', ['Entendido']); return false; }
  if (cur !== ruta) openTab(ruta, true);
  if (!edits.has(ruta)) startEdit(ruta, await api('/api/abrir?ruta=' + encodeURIComponent(ruta)));
  const ed = edits.get(ruta), out = applyBlocks(ed.text, blocks.map(([s, r]) => [norm(s), norm(r)]));
  if (out === null) { ask('No se pudo aplicar', 'El texto a buscar no aparece exactamente una vez en el archivo (¿cambió desde entonces?).', ['Entendido']); return false; }
  ed.text = out; pinTab(ruta); backupSoon(ruta);

}
function parseBlocks(t) {
  return [...norm(t).matchAll(/<<<<<<< BUSCAR\n([\s\S]*?)\n?=======\n([\s\S]*?)\n?>>>>>>> REEMPLAZAR/g)].map(m => [m[1], m[2]]);

// Cada BUSCAR debe aparecer exactamente una vez; si no, null y no se cambia nada (todo o nada).
function applyBlocks(text, blocks) {
  let out = text;
  for (const [s, r] of blocks) {
    const i = out.indexOf(s);
    if (!s || i < 0 || out.indexOf(s, i + 1) >= 0) return null;
    out = out.slice(0, i) + r + out.slice(i + s.length);
  }
  return out;
}

  try { await img.decode(); } catch { throw new Error('No se pudo abrir la imagen para enviarla a la IA'); }
  const s = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = Object.assign(document.createElement('canvas'), { width: Math.round(img.naturalWidth * s), height: Math.round(img.naturalHeight * s) });
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);

function findRefs(t) {
  const out = new Set(), book = '(?:[123] )?[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+';
  for (const m of t.matchAll(new RegExp(`(${book}) (\\d+):(\\d+)(?:[-–](\\d+))?((?:,\\s*\\d+(?:[-–]\\d+)?)*)`, 'g'))) {
    const [, b, ch, v1, v2, more] = m;
    out.add(`${b} ${ch}:${v1}${v2 ? '-' + v2 : ''}`);
    for (const x of more.matchAll(/(\d+)(?:[-–](\d+))?/g)) out.add(`${b} ${ch}:${x[1]}${x[2] ? '-' + x[2] : ''}`);
  }
  return [...out];
}
// ✓ Verificar citas: ejecuta verificar_citas.py del proyecto con las referencias bíblicas de la respuesta (editables).
function verifyCites(texto) {
  const d = $('#dlg');
  d.className = 'wide'; d.oninput = d.onchange = null; d.onclose = null;
  d.innerHTML = `<b>Verificar citas con verificar_citas.py</b><p class="ok">Una referencia por línea. Corrige o añade las que falten (formato: 1 Samuel 4:4 o 1 Samuel 4:1-3).</p>
    <textarea id="vRefs" spellcheck="false"></textarea>
    <div class="exp-actions"><button class="primary" id="vOk">Verificar</button><button id="vNo">Cancelar</button></div>`;
  $('#vRefs').value = findRefs(texto).join('\n');
  $('#vNo').onclick = () => d.close();
  $('#vOk').onclick = () => {
    const refs = $('#vRefs').value.split('\n').map(s => s.trim()).filter(Boolean);
    d.close();
    if (!refs.length) return;
    const script = conv.verificador, dir = script.replace(/[\\/][^\\/]*$/, '');
    launch(() => api('/api/ejecutar', { ruta: script, args: refs }), 'verificar_citas.py',
      'python verificar_citas.py ' + refs.map(r => `"${r}"`).join(' '), dir, script, r => {
        const out = r.trozos.map(x => x[1]).join('').trim();
        $('#convQ').value = `Resultado de verificar_citas.py (RVR60):\n${out}\n\nUsa solo este texto en las citas y corrige las que no coincidan o salgan como NO ENCONTRADA.`;
        iaRefresh(); $('#convQ').focus();
        flash('Verificación lista en el chat: revísala y pulsa Enviar');
      });
  };
  d.showModal();
}

// ---------- reglas: Markdown a la izquierda, vista previa a la derecha ----------
function addRule(t, rule, sec) {
  const line = '- ' + rule;
  const m = sec && [...t.matchAll(/^## (.+)$/gm)].find(x => x[1].trim() === sec);
  if (!m) return t.replace(/\n*$/, '\n') + line + '\n';
  const after = m.index + m[0].length, next = t.slice(after).search(/^#{1,2} /m);
  const end = next < 0 ? t.length : after + next;
  return t.slice(0, end).replace(/\n*$/, '\n') + line + '\n' + (end < t.length ? '\n' + t.slice(end) : '');
}
// Modal de reglas.md: editor a la izquierda y vista previa a la derecha; se guarda en el proyecto.
function rulesDialog() {
  const info = rulesInfo?.reglas, proj = rulesInfo?.proyecto;
  if (!info) return;
  const d = $('#dlg');
  d.className = 'rules'; d.oninput = d.onchange = null; d.onclose = null;
  d.innerHTML = `<b></b><div class="rgrid"><div id="rEd"></div><div id="rPrev" class="page"></div></div>
    <form class="frow" id="rAdd">+ Nueva regla: <input id="rNew" placeholder="Ej.: Usar Tailwind, no Bootstrap"><select id="rSec"></select><button>Añadir</button></form>
    <div class="iarow"><span id="rCount" class="ok"></span><div class="exp-actions"><button class="primary" id="rSave">Guardar</button><button id="rCancel">Cancelar</button></div></div>`;
  d.querySelector('b').textContent = 'Reglas · ' + proj.nombre;
  const orig = norm(info.texto || '');
  const cm = CodeMirror($('#rEd'), { value: orig, mode: 'markdown', lineWrapping: true,
    theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'material-darker' : 'default' });
  CodeMirror.autoLoadMode(cm, 'markdown');
  const upd = () => {
    const t = cm.getValue(), n = (t.match(/^\s*[-*+]\s+\S/gm) || []).length, tok = Math.ceil(t.length / 4);
    $('#rPrev').innerHTML = DOMPurify.sanitize(marked.parse(t));
    const long = tok > (AJ.reglas_aviso_tokens || 300);
    $('#rCount').textContent = `${n} regla${n === 1 ? '' : 's'} · ≈ ${tok} tokens por petición` + (long ? ' · conviene acortarlas' : '');
    $('#rCount').className = long ? 'warn' : 'ok';
    const S = $('#rSec'), keep = S.value;
    S.innerHTML = '';
    S.append(new Option('al final', ''), ...[...t.matchAll(/^## (.+)$/gm)].map(m => new Option('en ' + m[1].trim(), m[1].trim())));
    S.value = [...S.options].some(o => o.value === keep) ? keep : '';
  };
  cm.on('change', upd); upd();
  $('#rAdd').onsubmit = e => {
    e.preventDefault();
    const r = $('#rNew').value.trim(); if (!r) return;
    cm.setValue(addRule(cm.getValue(), r, $('#rSec').value)); $('#rNew').value = ''; $('#rNew').focus();
  };
  $('#rCancel').onclick = async () => { if (cm.getValue() === orig || await ask('Descartar cambios', '¿Descartar los cambios en las reglas?', ['Descartar', 'Seguir editando'], { danger: true }) === 'Descartar') d.close(); };
  $('#rSave').onclick = async () => {
    const r = await fetch('/api/guardar', { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ ruta: info.ruta, texto: cm.getValue(), codificacion: info.codificacion, eol: info.eol, mtime: info.mtime }) });
    const res = await r.json();
    if (r.status === 409) return ask('reglas.md cambió', 'Se modificó fuera de este diálogo. Cierra y vuelve a abrir las reglas para no perder ningún cambio.', ['Entendido']);
    if (!r.ok) return ask('No se pudo guardar', res.error, ['Entendido']);
    d.close(); iaOnFile();
    if (edits.has(info.ruta)) flash('Ojo: reglas.md también está abierto en edición');
  };
  d.showModal(); setTimeout(() => cm.refresh(), 0);
}

// ---------- columnas redimensionables y pantalla completa ----------
const WIDTH = { min: 180, max: 600, doc: 300 }; // límites en px; el documento nunca baja de 300
function setWidth(v, px) {
  document.documentElement.style.setProperty(v, px + 'px');
  try { localStorage.setItem('atril' + v, px); } catch {}
}
for (const h of document.querySelectorAll('.rs')) {
  const v = h.dataset.var, sign = v === '--iaW' ? -1 : 1; // la IA crece hacia la izquierda
  h.onmousedown = e => {
    e.preventDefault();
    const x0 = e.clientX, w0 = h.parentElement.offsetWidth;
    const other = (v === '--iaW' ? $('aside') : $('#ia')).offsetWidth; // 0 si está oculto
    const max = Math.min(WIDTH.max, innerWidth - 44 - other - WIDTH.doc);
    h.classList.add('drag'); document.body.classList.add('dragging');
    const mv = ev => setWidth(v, Math.max(WIDTH.min, Math.min(max, w0 + sign * (ev.clientX - x0))));
    addEventListener('mousemove', mv);
    addEventListener('mouseup', () => { removeEventListener('mousemove', mv); h.classList.remove('drag'); document.body.classList.remove('dragging'); editorCM?.refresh(); }, { once: true });
  };
  h.ondblclick = () => { setWidth(v, +h.dataset.def); editorCM?.refresh(); };
  try { const w = localStorage.getItem('atril' + v); if (w) document.documentElement.style.setProperty(v, w + 'px'); } catch {}
}

// ⤢ amplía una zona (doc, ia, con) a toda la ventana; ⤡ o Esc vuelve a como estaba justo antes
let maxZone = null;
const ZONE_NAME = { doc: 'el documento', ia: 'el panel de IA', con: 'la consola' };
function maxBtn(zone) {
  const b = iconBtn('max', '', () => setMax(maxZone === zone ? null : zone));
  b.dataset.zone = zone; paintMax(b);
  return b;
}
function paintMax(b) {
  const on = maxZone === b.dataset.zone;
  b.innerHTML = svg(on ? 'min' : 'max');
  b.title = on ? 'Volver a como estaba (Esc)' : `Ampliar ${ZONE_NAME[b.dataset.zone]} a toda la ventana`;
}
// ⤢ Pantalla completa de una zona (documento, IA o consola); Esc vuelve. CodeMirror necesita refresh al cambiar de tamaño.
function setMax(zone) {
  maxZone = zone;
  document.body.classList.remove('max-doc', 'max-ia', 'max-con');
  if (zone) document.body.classList.add('max-' + zone);
  document.querySelectorAll('button[data-zone]').forEach(paintMax);
  editorCM?.refresh(); // CodeMirror no se entera solo de que cambió el tamaño de su caja
}

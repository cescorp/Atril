<script>
  // Atajos de VS Code con los comandos que trae el keymap de Sublime (sin internet, solo quedan los de siempre)
  if (window.CodeMirror?.commands.swapLineUp) {
    CodeMirror.commands.duplicateLineUp = cm => { // duplicateLine deja el cursor en la copia de abajo; VS Code, arriba
      const empty = !cm.somethingSelected();
      cm.execCommand('duplicateLine');
      if (empty) cm.setSelections(cm.listSelections().map(r => ({ anchor: CodeMirror.Pos(r.anchor.line - 1, r.anchor.ch), head: CodeMirror.Pos(r.head.line - 1, r.head.ch) })));
    };
    CodeMirror.defaults.extraKeys = {
      'Alt-Up': 'swapLineUp', 'Alt-Down': 'swapLineDown',
      'Shift-Alt-Up': 'duplicateLineUp', 'Shift-Alt-Down': 'duplicateLine',
      'Ctrl-Alt-Up': 'addCursorToPrevLine', 'Ctrl-Alt-Down': 'addCursorToNextLine',
      'Ctrl-D': 'selectNextOccurrence', 'Shift-Ctrl-L': 'findAllUnder', 'Shift-Ctrl-K': 'deleteLine' };
  }
</script>
<script>CodeMirror.modeURL = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/%N/%N.min.js';</script>
<script>
  // Lenguajes que no trae el paquete común de highlight.js
  for (const l of ['powershell', 'dos', 'dockerfile', 'latex', 'scala', 'groovy', 'dart', 'elixir', 'erlang', 'haskell',
                   'fsharp', 'vbscript', 'julia', 'clojure', 'elm', 'protobuf', 'x86asm', 'arduino', 'awk', 'matlab'])
    document.write(`<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/${l}.min.js"><\/script>`);
</script>
<style>
/* Estilo inspirado en Obsidian: grises neutros, acento morado, árbol con líneas guía */
:root{--bg:#fff;--side:#f6f6f6;--paper:#fff;--ink:#222;--muted:#5c5c5c;--faint:#ababab;--line:#e3e3e3;--accent:#7c5cdb;--hover:rgba(0,0,0,.05);--active:rgba(0,0,0,.085);--chip:#f0f0f0;--warn:#a35a00;--warnbg:#fbecd6;--lock:#8a2f2f;--lockbg:#f6dede}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--side:#262626;--paper:#1e1e1e;--ink:#dadada;--muted:#a3a3a3;--faint:#666;--line:#363636;--accent:#a68af9;--hover:rgba(255,255,255,.06);--active:rgba(255,255,255,.1);--chip:#2a2a2a;--warn:#f0b46a;--warnbg:#3a2c18;--lock:#f0a0a0;--lockbg:#3a2020}}
*{box-sizing:border-box}
/* overflow:clip y no hidden: hidden deja que scrollIntoView() desplace la página entera aunque no haya barra */
html,body{height:100%;overflow:clip}
/* minmax(0,1fr): la columna central nunca se estira por su contenido (muchas pestañas, rutas largas) */
body{margin:0;display:grid;grid-template-columns:44px var(--sideW,260px) minmax(0,1fr);background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}
body.noside{grid-template-columns:44px minmax(0,1fr)} /* sin la barra, el contenido pasa a la 2.ª columna */
body.noside aside{display:none}
body.ia{grid-template-columns:44px var(--sideW,260px) minmax(0,1fr) var(--iaW,340px)}
body.ia.noside{grid-template-columns:44px minmax(0,1fr) var(--iaW,340px)}
/* bordes arrastrables (doble clic: ancho original) */
.rs{position:absolute;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.rs:hover,.rs.drag{background:var(--accent);opacity:.45}
aside .rs{right:-3px}#ia .rs{left:-3px}
body.dragging{user-select:none}body.dragging iframe{pointer-events:none}
/* ⤢ pantalla completa: se oculta lo demás sin tocar su estado, así ⤡ vuelve exactamente a como estaba */
body.max-doc,body.max-ia,body.max-con{grid-template-columns:minmax(0,1fr)!important}
body.max-doc #ribbon,body.max-doc aside,body.max-doc #ia,body.max-doc #panel,
body.max-ia #ribbon,body.max-ia aside,body.max-ia main,
body.max-con #ribbon,body.max-con aside,body.max-con #ia,
body.max-con #panes,body.max-con #status{display:none!important}
body.max-con main{grid-template-rows:1fr}
body.max-con #panel{height:auto!important}
/* panel de IA */
#ia{position:relative;z-index:3;display:none;flex-direction:column;border-left:1px solid var(--line);background:var(--side);min-height:0;min-width:0}
body.ia #ia{display:flex}
#ia.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
#ia.dropping::after{content:"⤓ Suelta aquí para adjuntar";position:absolute;left:16px;right:16px;top:45%;text-align:center;padding:14px;border-radius:8px;background:var(--paper);color:var(--accent);font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.15);pointer-events:none}
.convtop{display:flex;gap:6px;padding:8px 12px;align-items:center;border-bottom:1px solid var(--line)}
.convtop select{flex:1;min-width:0}
.convtop button{font-size:12px;padding:2px 8px}
.convtop button.ic{width:26px;height:26px;padding:0}.convtop button.ic svg{width:15px;height:15px}
.clink{display:flex;align-items:center;gap:4px;max-width:120px;flex:none;color:var(--faint)}
.clink svg{width:14px;height:14px;flex:none}.clink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clink.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
#ctx{display:flex;flex-direction:column;gap:1px;font-size:12px;margin:8px 0 6px}
#ctx button.small{align-self:flex-start;margin-top:3px;padding:1px 8px;font-size:11px}
.att{display:flex;gap:6px;align-items:center;padding:2px 0}
.att .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att{flex-wrap:wrap}.att .aviso{flex-basis:100%;padding-left:22px;font-size:12px}
.att .eye{font-style:normal;cursor:pointer;opacity:.35}.att .eye:hover,.att .eye.on{opacity:1}
.att b{font-weight:400;cursor:pointer;opacity:.5}.att b:hover{opacity:1}
#convLog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msgtu{align-self:flex-end;max-width:90%;background:var(--accent);color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.msgtu small{display:block;opacity:.8;font-size:11px;margin-top:4px}
#convQ{width:100%;min-height:70px;resize:vertical;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
#vRefs{width:100%;min-height:140px;font:12.5px/1.5 Consolas,monospace;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#ia>header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
#ia>header b{flex:1;font-weight:600}
#ia select,.crow select,.frow select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
#iaRules{padding:8px 12px;font-size:12px;border-bottom:1px solid var(--line);color:var(--muted)}
#iaRules button{font-size:12px;padding:1px 8px}
#iaRules .link{cursor:pointer;color:var(--ink)}#iaRules .link:hover{color:var(--accent)}
.iaask{padding:0 12px 10px;border-top:1px solid var(--line)}
.iarow{display:flex;align-items:center;gap:8px;margin-top:6px}
.iarow>span{flex:1;font-size:11px}
.iacard{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;line-height:1.5}
.iacard .meta{font-size:11px;color:var(--faint);margin-bottom:4px}
.iacard .q{color:var(--muted);margin-bottom:6px;white-space:pre-wrap}
.iacard .md{overflow-wrap:anywhere}.iacard .md pre{background:var(--bg);padding:8px;border-radius:6px;overflow:auto;font-size:12px}
.iacard .err{color:var(--lock);white-space:pre-wrap}
.diff{font:12px/1.5 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;margin:6px 0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.diff div{padding:0 6px}.diff .del{background:rgba(220,40,40,.12);color:#c03030}.diff .add{background:rgba(40,160,80,.14);color:#1f8a46}
.diff hr{border:0;border-top:1px dashed var(--line);margin:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.acts button{padding:2px 10px;font-size:12px}
button.ic[data-st]{position:relative}
button.ic[data-st]::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--faint)}
button.ic[data-st=ok]::after{background:#2e8b57}button.ic[data-st=warn]::after{background:#e0a000}
.crow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.crow small{display:block;color:var(--faint)}
#cHelp{margin:10px 0;white-space:pre-wrap}
#cHelp code{background:var(--bg);padding:2px 6px;border-radius:4px;user-select:all}
dialog#dlg.rules{max-width:none;width:min(1100px,calc(100vw - 32px))}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:55vh;margin:12px 0}
#rEd{min-height:0}#rEd .CodeMirror{height:100%;border:1px solid var(--line);border-radius:6px}
#rPrev{overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px 20px;font-size:16px;max-width:none;margin:0}
#rAdd input{flex:1;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.ic{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border:0;background:none;color:var(--muted);border-radius:5px}
button.ic:hover:not(:disabled){background:var(--hover);color:var(--ink)}
button.small{padding:2px 10px;font-size:12px}
/* cinta de iconos */
#ribbon{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--side);border-right:1px solid var(--line)}
#ribbon .sp{flex:1}
/* barra lateral */
aside{position:relative;display:grid;grid-template-rows:minmax(0,1fr);background:var(--side);border-right:1px solid var(--line);min-width:0;min-height:0}
.sidescroll{overflow:auto;padding:0 8px 12px;min-height:0}
.sidetools{display:flex;justify-content:center;gap:2px;padding:8px 0;position:sticky;top:0;background:var(--side);z-index:1}
aside h2{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:12px 8px 4px}
.node{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;color:var(--muted);font-size:13px;user-select:none}
.node:hover{background:var(--hover);color:var(--ink)}
.node.on{background:var(--active);color:var(--ink)}
.node .chev{display:inline-block;width:14px;flex:none;text-align:center;color:var(--faint);transition:transform .1s}
.node.open .chev{transform:rotate(90deg)}
.node .n{overflow:hidden;text-overflow:ellipsis;flex:1}
.nm{display:flex;min-width:0}.nm .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.nm .e{flex:none;white-space:pre}
.node.bak{opacity:.5}body:not(.showbak) .node.bak{display:none}
#sidetools .bakbtn{font-size:11px;font-weight:600;width:auto;padding:0 6px}body.showbak #sidetools .bakbtn{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.node .x{opacity:0;font-size:12px}.node:hover .x{opacity:.6}.node .x:hover{opacity:1}
.kids{margin-left:12px;padding-left:4px;border-left:1px solid var(--line)}
.kids:empty{display:none}
/* abierto en pestaña: negrita; vista previa: cursiva */
.node.tab-open .n{font-weight:600;color:var(--ink)}.node.tab-pre .n{font-style:italic}
/* estado de git: punto; al pasar el ratón se cambia por (i) */
.gd{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px;background:#fff;border:1px solid #222;box-sizing:border-box}
.gd[data-g=limpio]{background:#2e8b57;border-color:#2e8b57}.gd[data-g=modificado]{background:#e0a000;border-color:#e0a000}
.gd[data-g=nuevo]{background:#3b82f6;border-color:#3b82f6}.gd[data-g=conflicto]{background:#d33;border-color:#d33}
.gd[data-g=ignorado]{background:#9a9a9a;border-color:#9a9a9a}
.node .ib{display:none;width:16px;height:16px;padding:0;margin:0 0 0 2px;flex:none;border:1px solid var(--muted);border-radius:50%;background:none;color:var(--muted);font:italic 600 10px/14px Georgia,serif;cursor:pointer}
.node:hover .ib{display:inline-block}.node:hover .gd{display:none}.node .ib:hover{border-color:var(--accent);color:var(--accent)}
/* buscador */
.sidesearch{position:relative;padding:0 4px 6px}
.sidesearch input{width:100%;font:inherit;font-size:13px;padding:5px 80px 5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
/* conmutadores dentro del cuadro, como en VS Code: Aa · nombre · contenido */
.stog{position:absolute;right:8px;top:3px;display:flex;gap:2px}
.stog button{width:22px;height:22px;padding:0;display:grid;place-items:center;border:1px solid transparent;border-radius:4px;background:none;color:var(--faint);font:600 11px Inter,sans-serif;cursor:pointer}
.stog button:hover{color:var(--ink);background:var(--hover)}
.stog svg{width:14px;height:14px}
.stog button.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
/* dos vistas en la barra lateral, como en VS Code: 📁 Explorador · 🔍 Buscar (cada una guarda lo suyo) */
body:not(.vsearch) :is(#stop,#results),body.vsearch :is(#sidetools,.sidescroll>h2,#projects,#loose){display:none}
body:not(.noside):not(.vsearch) #ribbon [data-v=e],body.vsearch:not(.noside) #ribbon [data-v=b]{color:var(--accent);box-shadow:inset 2px 0 var(--accent)}
.stop{position:sticky;top:0;background:var(--side);z-index:1;padding-bottom:4px}
.shead{display:flex;align-items:center;padding:6px 0 4px}.shead h2{flex:1;margin:0 8px}
.shead button.ic{width:24px;height:24px}.shead button.ic svg{width:15px;height:15px}
.sinfo{font-size:11px;color:var(--faint);margin:0 8px}
.schips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 4px 0}.schips:empty{display:none}
.schips button{font:500 11px Inter,sans-serif;padding:1px 8px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.schips button:hover{color:var(--ink);background:var(--hover)}
.schips button.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.schips b{font-weight:600;margin-left:4px;opacity:.7}
.sempty{color:var(--faint);font-size:12px;margin:10px 8px;line-height:1.5}
.sproj>.node{font-size:11px;font-weight:600;color:var(--muted);margin-top:6px}
.sproj.fold>.spk,.sfile.fold>.shits{display:none}
.sproj:not(.fold)>.node .chev,.sfile:not(.fold)>.node .chev{transform:rotate(90deg)}
.cnt{flex:none;font:600 10.5px/16px Inter,sans-serif;min-width:18px;text-align:center;padding:0 5px;border-radius:8px;background:var(--hover);color:var(--muted)}
.stag{flex:none;font-size:10.5px;line-height:15px;padding:0 5px;border:1px solid var(--line);border-radius:8px;color:var(--faint)}
.res{align-items:flex-start}.res .rb{display:flex;flex-direction:column;min-width:0;flex:1}
.res small{color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shits{margin-left:18px;border-left:1px solid var(--line)}
.shit{display:flex;gap:6px;padding:2px 6px 2px 8px;border-radius:0 4px 4px 0;cursor:pointer;font-size:12px;line-height:1.4;color:var(--muted)}
.shit:hover,.sr:focus{background:var(--hover);color:var(--ink);outline:none}
.shit .pg{flex:none;width:44px;color:var(--faint);font-variant-numeric:tabular-nums}
.shit .sn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
mark{background:#ffe58a;color:#1f1f1f;border-radius:2px}
/* modal de información e índice */
dialog#dlg.info h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
dialog#dlg.info dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0;font-size:13px}
dialog#dlg.info dt{color:var(--muted)}dialog#dlg.info dd{margin:0;overflow-wrap:anywhere}
dialog#dlg.info{max-height:85vh;overflow:auto}
.proj>.node{color:var(--ink);font-weight:500}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:2px 8px 6px 24px}
.badge{font-size:11px;padding:1px 6px;border:0;border-radius:9px;background:var(--warnbg);color:var(--warn);cursor:pointer}
.badge:hover{outline:1px solid var(--warn)}
.ok{font-size:11px;color:var(--muted)}
.lock{color:var(--lock)}
.missing{opacity:.5;text-decoration:line-through}
/* pestañas */
main{display:grid;grid-template-rows:1fr auto auto;min-width:0;min-height:0}
/* vista dividida: cada .pane tiene sus #tabs, #bar y #view; $() busca primero en la activa (.on) */
#panes{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;min-height:0}
body.split #panes{grid-template-columns:minmax(0,var(--splitL,1fr)) 5px minmax(0,1fr)}
/* minmax(0,1fr): sin esto la columna implícita crece hasta el ancho del Word/PDF y el lado tapa al otro y esconde sus botones */
.pane{position:relative;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr);min-width:0;min-height:0}
#splitGrip{cursor:ew-resize;background:var(--line);transition:background .15s}#splitGrip:hover,#splitGrip.drag{background:var(--accent)}
body.split .pane.on #tabs{box-shadow:inset 0 2px 0 var(--accent)}
body.split .pane:not(.on) #view{opacity:.92}
.pane #tabs.dropin{background:color-mix(in srgb,var(--accent) 12%,var(--side))}
/* panel de consola */
#panel{display:grid;grid-template-rows:4px auto 1fr auto auto;height:260px;border-top:1px solid var(--line);background:var(--side);min-height:0}
#panel[hidden]{display:none}
#grip{cursor:ns-resize}
.ph{display:flex;align-items:center;gap:2px;padding:2px 8px}
#runtabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.rtab{display:flex;gap:8px;align-items:center;padding:3px 10px;border-radius:5px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.rtab:hover{background:var(--hover)}
.rtab.on{background:var(--paper);color:var(--ink)}
.rtab.okr span{color:#2e8b57}.rtab.bad span{color:var(--lock)}
.rtab b{font-weight:400;opacity:.45}.rtab b:hover{opacity:1}
#out{margin:0;overflow:auto;padding:8px 12px;background:var(--paper);font:12.5px/1.5 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word}
#out .err{color:#d14}#out .cmd{color:var(--faint)}#out .in{color:var(--accent)}
#inrow{display:flex;gap:6px;align-items:center;padding:4px 12px;background:var(--paper);border-top:1px solid var(--line);font:12.5px Consolas,"Cascadia Mono",monospace;color:var(--accent)}
#inrow[hidden]{display:none}
#inrow input{flex:1;border:0;background:none;color:var(--ink);font:inherit;outline:none}
#runbar{display:flex;gap:6px;align-items:center;padding:5px 8px;font-size:12px;flex-wrap:wrap}
#runbar button{padding:2px 10px;font-size:12px}
.rstate{margin-right:auto;color:var(--muted)}
.warn{color:var(--warn)}
#tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;padding:6px 8px 0;background:var(--side);border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;max-width:220px;color:var(--muted);font-size:13px}
.tab.dl{box-shadow:inset 2px 0 var(--accent)}.tab.dr{box-shadow:inset -2px 0 var(--accent)} /* dónde cae la pestaña arrastrada */
.tab:hover{background:var(--hover)}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.pre span{font-style:italic}
.tab.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line);clip-path:inset(-1px -1px 0 -1px)}
.tab b{font-weight:400;opacity:.45;font-size:12px}.tab b:hover{opacity:1}
#tabs button.ic{width:26px;height:26px;margin:0 0 3px 2px}
/* cabecera del archivo: ← → migas ⋮ */
#bar{display:flex;gap:2px;align-items:center;padding:4px 8px;background:var(--paper);min-height:40px}
.crumbs{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px;padding:0 8px}
.crumbs b{font-weight:400;color:var(--ink)}
.menu{position:fixed;z-index:20;display:flex;flex-direction:column;min-width:190px;max-height:calc(100vh - 8px);overflow:auto;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.menu button{border:0;background:none;text-align:left;padding:6px 10px;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button{max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
/* comparar versiones: cabecera con la versión de cada columna, debajo el merge de CodeMirror */
dialog#dlg.cmp{max-width:none;width:calc(100vw - 32px);height:calc(100vh - 32px);padding:0;display:none;flex-direction:column}
dialog#dlg.cmp[open]{display:flex}
.cmp>header,.cmp>footer{display:flex;align-items:center;gap:12px;padding:10px 16px}
.cmp>header{border-bottom:1px solid var(--line)}.cmp>footer{border-top:1px solid var(--line);font-size:13px}
.cmp>header b{font-size:15px}.cmp>header .seg{margin-left:auto}
.cmp .seg{display:inline-flex}.cmp .seg button{border-radius:0;font-size:12px}.cmp .seg button:first-child{border-radius:5px 0 0 5px}.cmp .seg button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}
.cmp .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cheads{display:grid;gap:32px;padding:8px 16px 6px;background:var(--side);border-bottom:1px solid var(--line)}
.chead{display:flex;gap:6px;min-width:0}
.cpick{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;padding:4px 10px;background:var(--paper)}
.cbody{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:var(--clw,250px) minmax(0,1fr) 20px}
.clist{position:relative}
.cpick.missing{color:var(--muted);font-style:italic}
/* combo de versiones: commit con ▸ y sus archivos debajo */
.menu .vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.menu .vrow[hidden]{display:none}
.menu .vexp{padding:4px 8px;font-size:11px;color:var(--muted);border-radius:4px}.menu .vexp:hover{color:var(--accent)}
.menu .vfiles{grid-column:1/-1;display:flex;flex-direction:column;margin:0 0 4px 18px;padding-left:8px;border-left:2px solid var(--line)}
.menu .vfiles[hidden]{display:none}.menu .vfiles .ok{padding:4px 6px;font-size:12px}
.menu .vfile{display:flex;gap:8px;align-items:center;padding:3px 6px;font:12px/1.4 Consolas,monospace}
.menu .vfile span{overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;flex:1;min-width:0} /* rutas largas: se ve el final */
.menu .vfile i{font:italic 11px Inter,system-ui,sans-serif;color:var(--accent);flex:none}
.menu .vfile.del span{color:var(--faint);text-decoration:line-through}
.st{flex:none;width:16px;text-align:center;font-weight:700;font-size:11px;border-radius:3px;color:#fff;background:#888}
.st.M{background:#d99a1e}.st.A{background:#2e9e57}.st.D{background:#d64545}.st.R,.st.C{background:#4a7fd6}
.clrs{position:absolute;top:0;bottom:0;right:-3px;width:6px;cursor:col-resize;z-index:5}
.clrs:hover,body.dragging .clrs{background:var(--accent);opacity:.45}
.cbody .CodeMirror-merge-gap{cursor:col-resize}.cbody .CodeMirror-merge-gap:hover{background:color-mix(in srgb,var(--accent) 12%,var(--side))}
.cbody.nolist{grid-template-columns:minmax(0,1fr) 20px}.cbody.nolist .clist{display:none} /* oculta no ocupa columna: el merge pasa a la 1.ª */
.cbody>p{grid-column:1/-1}.cbody>.clist+p.cload{grid-column:2/-1}.cload{padding:16px}
/* cambio de archivo o versión sin brusquedad: lo anterior atenuado con «Cargando…» encima, lo nuevo con fundido */
.cbody{position:relative}
.cmerge.stale{opacity:.35;filter:grayscale(.6);pointer-events:none;transition:opacity .15s}
.cload.over{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);z-index:6;margin:0;padding:6px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12);color:var(--ink)}
.cmerge.fresh{animation:cmfade .18s ease-out}
@keyframes cmfade{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cmerge.fresh{animation:none}}
.cmerge{min-width:0;min-height:0;height:100%}
.cheads{position:relative;height:40px} /* cada combo se coloca encima de su columna (syncHeads) */
.cheads .chead{position:absolute;top:6px}
/* ◧ arriba a la izquierda, sobre la lista (como el de la barra lateral de Atril) */
.cheads #clistb{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.cheads #clistb.on{color:var(--accent)}
/* lista de cambios: una fila por cambio, la actual marcada; clic = ir */
.clist{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--side)}
.ctabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.ctabs button{flex:1;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;background:none;padding:6px 8px;font-size:12.5px;color:var(--muted);margin-bottom:-1px}
.ctabs button.on{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600}
.ctabs button span{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--chip);font-size:11px;font-weight:600}
.ctabs button.on span{background:var(--accent);color:#fff}
.ctab{display:flex;flex-direction:column;min-height:0;flex:1}.ctab[hidden]{display:none}
.ctab .cl{overflow:auto;flex:1;padding:0 6px 8px}
.fgroup{position:sticky;top:0;z-index:1;background:var(--side);padding:6px 4px 4px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line);margin-bottom:3px}
.cfrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;font:12px/1.4 Consolas,monospace}
.cfrow:hover{background:var(--hover)}.cfrow[hidden]{display:none}
.cfrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.cfrow.cur{cursor:default;background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 3px 0 0 var(--accent);font-weight:700}
.cfrow.cur span::after{content:' ●';color:var(--accent)}
.cfrow.del span{color:var(--faint);text-decoration:line-through}
.fext{flex:none;min-width:38px;text-align:center;font:600 10px/16px Inter,system-ui,sans-serif;border-radius:3px;background:var(--chip);color:var(--muted);text-transform:lowercase}
.csum{margin:0;padding:6px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}.csum:empty{display:none}
.clist input{margin:8px;font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
.chg{display:grid;grid-template-columns:22px 1fr auto;gap:0 6px;padding:5px 8px 5px 10px;border-radius:5px;cursor:pointer;font-size:12px;border-left:3px solid var(--c);margin-bottom:2px}
.chg:hover{background:var(--hover)}.chg[hidden]{display:none}
.chg b{color:var(--muted);font-weight:600}.chg b::before{content:attr(data-n)}
.chg span{color:var(--muted);display:flex;align-items:center;gap:6px}.chg em{font-style:normal;font-weight:600;color:var(--c)}
.chg .st{font-style:normal;width:16px;height:16px;line-height:16px}.st.add{background:#2e9e57}.st.del{background:#d64545}.st.mod{background:#d99a1e}
/* el cambio en el que estás: ▶, fondo del acento y borde más grueso */
.chg.cur{background:color-mix(in srgb,var(--accent) 16%,transparent);border-left-width:5px;padding-left:8px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.chg.cur b::before{content:'▶';color:var(--accent)}.chg.cur code{font-weight:700}
.chg code{grid-column:1/-1;font:11.5px/1.4 Consolas,monospace;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chg.add,.cmk.add{--c:#2e9e57}.chg.del,.cmk.del{--c:#d64545}.chg.mod,.cmk.mod{--c:#d99a1e}
/* mapa: todo el archivo en la altura de la franja */
.cmap{position:relative;background:var(--side);border-left:1px solid var(--line);cursor:pointer}
.cmk{position:absolute;left:3px;right:3px;background:var(--c);border-radius:2px;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.cview{position:absolute;left:0;right:0;background:rgba(128,128,128,.22);border:1px solid rgba(128,128,128,.45);border-radius:2px;pointer-events:none}
.cbody .cm-flash{animation:cmflash 1.3s ease-out}
@keyframes cmflash{from{background:rgba(124,92,219,.35)}to{background:transparent}}
/* cada columna ocupa la altura del modal y tiene su propio scroll (el merge sincroniza el de todas) */
.cbody .CodeMirror-merge,.cbody .CodeMirror-merge-pane,.cbody .CodeMirror-merge-gap,.cbody .CodeMirror-merge .CodeMirror{height:100%;border:0}
.cbody .cm-blame{width:4px}.cbody.noblame .cm-blame{display:none}
.cm-blamebar{width:3px;height:100%;min-height:1em;margin-left:1px;opacity:.85}
.cm-blamei{position:absolute;right:16px;z-index:5;max-width:min(560px,70%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:1px 8px;border-radius:4px;border-left:3px solid var(--ac);background:color-mix(in srgb,var(--paper) 92%,var(--ac));color:var(--ac);
  box-shadow:0 1px 4px rgba(0,0,0,.12);font:italic 11.5px/1.5 Inter,system-ui,sans-serif;cursor:default}
/* pestaña web */
#bar .waddr{flex:1;min-width:120px;margin:0 6px;padding:4px 10px;border:1px solid var(--line);border-radius:14px;background:var(--side);color:var(--ink);font:13px/1.4 inherit}
#bar .waddr:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--paper)}
.pane>.webbox{grid-row:3;grid-column:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper);z-index:1}
.pane>.webbox[hidden]{display:none}.webbox .wframe{flex:1;height:auto}
#bar .waddr.winside::placeholder{color:var(--muted);font-style:italic;opacity:1} /* dirección desconocida tras navegar dentro */
.wframe{display:block;width:100%;height:100%;border:0;background:#fff}
.wblock{margin:48px auto;max-width:560px}.wblock .primary{margin-top:6px}
.wstart{max-width:640px;margin:64px auto;padding:0 16px;color:var(--muted)}
.wstart h4{margin:24px 0 8px;font-size:13px;color:var(--ink)}
.wfavs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.wfavs button{text-align:left;padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* comparar dos archivos: mismos colores que el comparador de git (rojo = solo en A, verde = solo en B) */
dialog#dlg.fcmp{max-width:none;width:calc(100vw - 32px);height:calc(100vh - 32px);padding:0;display:none;flex-direction:column}
dialog#dlg.fcmp[open]{display:flex}
.fcmp header,.fcmp footer{display:flex;gap:8px;align-items:center;padding:10px 14px}
.fcmp header{border-bottom:1px solid var(--line)}.fcmp header b{margin-right:auto}
.fcmp footer{border-top:1px solid var(--line)}
.fheads{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.fheads span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmerge{flex:1;min-height:0}
.fmerge .CodeMirror-merge,.fmerge .CodeMirror-merge-pane,.fmerge .CodeMirror-merge-gap,.fmerge .CodeMirror-merge .CodeMirror{height:100%;border:0}
.fmerge .CodeMirror-merge-left .CodeMirror-merge-l-chunk{background:rgba(220,40,40,.1)}
.fmerge .CodeMirror-merge-editor .CodeMirror-merge-l-chunk{background:rgba(40,160,80,.12)}
.fmerge .CodeMirror-merge-l-deleted{background:rgba(220,40,40,.32);border-radius:2px}
.fmerge .CodeMirror-merge-l-inserted{background:rgba(40,160,80,.35);border-radius:2px}
.fmerge [class*=CodeMirror-merge-][class*=-chunk-start]{border-top:1px solid rgba(128,128,128,.35)}
.fmerge [class*=CodeMirror-merge-][class*=-chunk-end]{border-bottom:1px solid rgba(128,128,128,.35)}
.fmerge .CodeMirror-merge-copy{color:var(--accent);font-size:15px}
.cleg{margin-left:auto}.cleg i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin:0 2px 0 8px}
.cleg i.del{background:#f4c7c7}.cleg i.add{background:#c9ecd2}
/* de izquierda (más vieja) a derecha (más nueva): lo que solo está a la izquierda = quitado (rojo), lo nuevo = añadido (verde) */
.cbody .CodeMirror-merge-left .CodeMirror-merge-l-chunk,.cbody .CodeMirror-merge-editor .CodeMirror-merge-r-chunk{background:rgba(220,40,40,.1)}
.cbody .CodeMirror-merge-editor .CodeMirror-merge-l-chunk,.cbody .CodeMirror-merge-right .CodeMirror-merge-r-chunk{background:rgba(40,160,80,.12)}
.cbody .CodeMirror-merge-l-deleted,.cbody .CodeMirror-merge-r-inserted{background:rgba(220,40,40,.32);border-radius:2px}
.cbody .CodeMirror-merge-l-inserted,.cbody .CodeMirror-merge-r-deleted{background:rgba(40,160,80,.35);border-radius:2px}
.cbody [class*=CodeMirror-merge-][class*=-chunk-start]{border-top:1px solid rgba(128,128,128,.35)}
.cbody [class*=CodeMirror-merge-][class*=-chunk-end]{border-bottom:1px solid rgba(128,128,128,.35)}
.menu .mkey{float:right;margin-left:28px;font:inherit;font-size:11.5px;color:var(--faint)}
.menu .msort{display:flex;align-items:center}.menu .msort>button:first-child{flex:1}
.menu .marrow{flex:none;width:28px;padding:4px 0;text-align:center;font-size:14px;color:var(--muted);border-radius:4px}
.menu .marrow:hover{color:var(--ink)}.menu .marrow.on{color:#fff;background:var(--accent)}
.menu button:disabled{opacity:.45;cursor:default;background:none}
.menu .msep{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .mhead{padding:6px 10px 4px;font-size:12px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .mhead b{color:var(--ink)}
.menu .msearch{position:sticky;top:-4px;margin:0 0 4px;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.menu .ok{padding:6px 10px}
/* barra de estado */
#status{display:flex;justify-content:flex-end;gap:14px;padding:3px 12px;font-size:11px;color:var(--faint);border-top:1px solid var(--line);background:var(--side);min-height:22px}
#stmain{display:flex;gap:14px}
#idx{margin-right:auto;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#idx:hover{color:var(--accent)}
.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#view{overflow:auto;padding:24px 16px;min-height:0;background:var(--paper)}
#view.flush{padding:0}
.empty{color:var(--muted);text-align:center;margin-top:22vh;line-height:1.8}
.warnbox{max-width:780px;margin:0 auto 12px;padding:8px 12px;border-radius:6px;background:var(--lockbg);color:var(--lock)}
/* vistas */
.page{max-width:760px;margin:0 auto;padding:24px 32px 64px;font:var(--docFont,18px)/1.7 "Source Serif 4",Georgia,serif}
.page h1,.page h2,.page h3,.page h4{font-family:Inter,sans-serif;font-weight:700;line-height:1.25}
.page h1{font-size:1.75em}
.page a{color:var(--accent)}
.page a[href^="http"]::after{content:"↗";font-size:.7em;margin-left:2px;vertical-align:super}
.page table{border-collapse:collapse;width:100%;font-size:15px}
.page th,.page td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.page img{max-width:100%}
.page pre{background:var(--bg);padding:12px;border-radius:6px;overflow:auto;font-size:14px;line-height:1.5}
.page code{font-family:Consolas,"Cascadia Mono",monospace;font-size:.88em}
.page blockquote{border-left:3px solid var(--accent);margin:0;padding-left:16px;color:var(--muted)}
.code{display:flex;background:var(--paper);min-height:100%;font:var(--codeFont,13px)/1.55 Consolas,"Cascadia Mono",monospace}
.code pre{margin:0;padding:14px 12px}
.code .nums{color:var(--muted);text-align:right;user-select:none;border-right:1px solid var(--line);opacity:.7}
.code code.hljs{padding:0;background:none}
.grid{border-collapse:collapse;font-size:13px;background:var(--paper)}
.grid th,.grid td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.grid th{position:sticky;top:0;background:var(--chip)}
.full{width:100%;height:100%;border:0;display:block;background:#fff}
.media{display:flex;justify-content:center;align-items:center;min-height:100%}
.media img{max-width:100%;max-height:85vh;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px}
.media video{max-width:100%;max-height:85vh}
.font{font-size:28px;line-height:1.6}
.card{max-width:520px;margin:12vh auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0}
.card dt{color:var(--muted)}
.cell{margin:14px 0}.cell .out{border-left:3px solid var(--line);padding-left:12px;font-size:15px}
.cell .out pre{background:none}
/* editor */
.CodeMirror{height:100%;font:var(--codeFont,13px)/1.55 Consolas,"Cascadia Mono",monospace;background:var(--paper);color:var(--ink)}
.docxbox{min-height:100%}
.wediting p.wed{outline:none;border-radius:2px;cursor:text}.wediting p.wed:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.wediting p.wed:focus{box-shadow:0 0 0 1px var(--accent)}.wediting p.wro{opacity:.6;cursor:not-allowed}
#bar .wfmt{min-width:26px;padding:1px 6px}
.docxbox p.pdrop-a{box-shadow:0 -3px 0 var(--accent)}.docxbox p.pdrop-d{box-shadow:0 3px 0 var(--accent)}
.iedit{display:flex;flex-direction:column;min-height:100%}
.itools,.icropbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;font-size:13px;background:var(--side);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10} /* por encima de las páginas que pasan por debajo */
.itools button{min-width:30px;padding:2px 8px}.itools input[type=number]{width:72px}.itools input[type=range]{width:90px;vertical-align:middle}
.istage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:repeating-conic-gradient(#8881 0 25%,transparent 0 50%) 0 0/16px 16px}
.iwrap{position:relative;display:inline-block;line-height:0}.iwrap canvas{max-width:100%;max-height:calc(100vh - 190px);touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.icrop{position:absolute;display:none;border:1px dashed #fff;outline:1px dashed #000;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.iwrap:has(.icrop) canvas{cursor:crosshair}
/* safe center: si la página es más ancha que el lado (vista dividida), se alinea a la izquierda en vez de cortarse por los dos bordes */
.ppages{display:flex;flex-direction:column;align-items:safe center;gap:18px;padding:16px;background:var(--bg)}
.phead{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}.phead button{padding:1px 7px}
.pbody{position:relative;isolation:isolate;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:crosshair;touch-action:none;overflow:hidden}
.pbody canvas{width:100%;height:100%;display:block}
.pnote{position:absolute}.pnote b{display:none;position:absolute;top:-8px;right:-8px;font-size:10px;background:var(--paper);border:1px solid var(--line);border-radius:50%;width:16px;height:16px;line-height:14px;text-align:center;cursor:pointer;color:var(--ink)}
.pnote:hover b{display:block}
.phl{background:rgba(255,230,0,.35);outline:1px solid rgba(200,170,0,.6)}
.rpage{cursor:auto;overflow:visible}.rpage canvas{position:absolute;inset:0}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(0,90,255,.3)}
#rpg{width:56px;text-align:right}.rpage,.ppage{scroll-margin-top:72px}
/* barra del PDF en lectura: grupos separados; miniaturas en una columna fija a la izquierda */
.itools .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.itools button.on{background:var(--active);border-color:var(--faint)}
.itools select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
.pwrap{display:flex;align-items:flex-start}.pwrap .ppages{flex:1;min-width:0}
.pthumbs{position:sticky;flex:none;width:150px;overflow:auto;padding:10px 0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px}.pthumbs[hidden]{display:none}
.pthumb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
.pthumb div{width:110px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);outline:2px solid transparent;outline-offset:2px}
.pthumb div canvas{width:100%;height:100%;display:block}
.pthumb:hover div{outline-color:var(--line)}.pthumb.cur div{outline-color:var(--accent)}.pthumb.cur{color:var(--accent);font-weight:600}
/* buscar y reemplazar (como VS Code); el cuadro vive en la .pane activa */
/* clip: nada del documento (p. ej. un elemento con posición absoluta del visor de Word) se pinta fuera del área central */
main{position:relative;overflow:clip}
#find{position:absolute;right:22px;z-index:20;display:grid;grid-template-columns:auto 1fr;gap:4px 4px;padding:5px 6px 5px 2px;background:var(--side);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:13px}
#find[hidden]{display:none}
#find .ftog{grid-row:1/3;width:18px;padding:0;border:0;background:none;color:var(--muted);align-self:stretch;transition:transform .12s}
#find.repl .ftog{transform:rotate(90deg)}#find.norepl .ftog{visibility:hidden}
#find .frow{display:flex;align-items:center;gap:2px;grid-column:2}
#find .frep{display:none}#find.repl .frep{display:flex}
#find .fbox{display:flex;align-items:center;width:300px;border:1px solid var(--line);border-radius:4px;background:var(--paper);padding-right:2px}
#find .fbox:focus-within{border-color:var(--accent)}
#find.bad .frow:first-child .fbox,#find.none .frow:first-child .fbox{border-color:#d9534f}
#find input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit;padding:4px 6px}
#find button{min-width:24px;height:24px;padding:0 4px;border:1px solid transparent;border-radius:4px;background:none;color:var(--ink);font-size:12px}
#find button:hover{background:var(--hover)}
#find button.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--accent)}
#find .fbox button{height:20px;min-width:22px}
#find.nosel .fsel{display:none}
#fcount{min-width:88px;padding:0 6px;font-size:12px;color:var(--muted);white-space:nowrap}#find.none #fcount{color:#d9534f}
::highlight(fall){background-color:rgba(255,200,0,.4)}
::highlight(fcur){background-color:rgba(255,120,0,.75)}
.cm-fmatch{background:rgba(255,200,0,.4);border-radius:2px}
.cm-fbar{background:rgba(230,150,0,.9);min-height:3px}
.ptx{white-space:pre;font-family:Helvetica,Arial,sans-serif;line-height:1;transform:translateY(-80%)}.docxbox .docx-wrapper{background:var(--bg)!important;padding:24px 16px!important;align-items:safe center!important}
.docxbox .docx-wrapper>section.docx{box-shadow:0 1px 4px rgba(0,0,0,.18);margin-bottom:24px!important}
.node.seldir:not(.on){box-shadow:inset 2px 0 0 var(--accent)}
.newrow input{flex:1;min-width:0;font:inherit;font-size:13px;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;background:var(--paper);color:var(--ink)}
.infoacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.copygroup{display:inline-flex}.copygroup button{border-radius:0;margin-left:-1px}
.copygroup button:first-child{border-radius:6px 0 0 6px;margin-left:0}.copygroup button:last-child{border-radius:0 6px 6px 0}
.CodeMirror-gutters{background:var(--paper);border-right:1px solid var(--line)}
#msg{color:var(--accent);white-space:nowrap;border-radius:4px;padding:0 6px}
#msg.flash{animation:flash 1.6s ease-out}@keyframes flash{0%,40%{background:var(--accent);color:#fff}100%{background:transparent}}
/* aviso o pregunta: centrado, sobre cualquier otro modal */
dialog#ask{border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:20px 22px 16px;width:min(440px,calc(100vw - 32px));box-shadow:0 18px 50px rgba(0,0,0,.28)}
dialog#ask[open]{animation:askin .14s ease-out}@keyframes askin{from{opacity:0;transform:translateY(6px) scale(.98)}}
#ask b{display:block;font-size:15px;margin-bottom:6px}
#ask p{margin:0 0 4px;line-height:1.5;white-space:pre-line;color:var(--muted);max-height:50vh;overflow:auto}#ask p:empty{display:none}
#ask input{width:100%;margin:10px 0 2px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#ask input:focus{outline:2px solid var(--accent);outline-offset:-1px}
#ask .exp-actions{justify-content:flex-end;margin-top:16px}
#ask button.danger{background:#d64545;border-color:#d64545;color:#fff}
dialog#dlg{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:20px;max-width:460px}
dialog#dlg p{line-height:1.5;white-space:pre-line}
dialog#dlg.wide{max-width:640px;width:calc(100vw - 32px)}
/* historial de cambios: [↶|▾] [↷|▾] y el modal tipo papelera */
.hgrp{display:inline-flex}.hgrp .hb{padding:1px 7px;min-width:0}.hgrp .hb:first-child{border-radius:6px 0 0 6px}
.hgrp .hb+.hb{border-radius:0 6px 6px 0;border-left:0;padding:1px 4px;font-size:10px}
dialog#dlg.hist{max-width:none;width:min(1100px,calc(100vw - 32px));height:min(720px,calc(100vh - 48px));padding:0;display:none;flex-direction:column}
dialog#dlg.hist[open]{display:flex}
/* 🖨 Imprimir: ajustes a la izquierda, la hoja a escala a la derecha */
dialog#dlg.prt{max-width:none;width:min(1100px,calc(100vw - 32px));height:min(780px,calc(100vh - 32px));padding:0;display:none;flex-direction:column}
dialog#dlg.prt[open]{display:flex}
.prt>header,.prt>footer{display:flex;align-items:center;gap:12px;padding:10px 16px}
.prt>header{border-bottom:1px solid var(--line);justify-content:space-between}.prt>footer{border-top:1px solid var(--line)}
.prbody{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.pset{padding:6px 18px 18px;border-right:1px solid var(--line);background:var(--side);overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.pset h4{margin:12px 0 0;font-size:12px;font-weight:600;color:var(--muted)}
.pset>label{display:flex;flex-direction:column;gap:4px}
.pset select,.pset input[type=number]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
.pset input[type=number]{width:72px}
.pset .pr{flex-direction:row;align-items:center;gap:8px;cursor:pointer}
.pset input[type=radio],.pset input[type=checkbox]{accent-color:var(--accent);margin:0}
.pseg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pseg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;cursor:pointer;background:var(--paper)}
.pseg label:has(:checked){background:var(--accent);color:#fff}.pseg input{position:absolute;opacity:0}
.ppreview{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;background:var(--bg);min-height:0;overflow:hidden}
.pholder{position:relative;flex:none}
.psheet{position:absolute;top:0;left:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25);overflow:hidden;box-sizing:border-box}
/* en la hoja y en el papel: siempre colores de papel, aunque Atril esté en oscuro */
.psheet,#printArea{--ink:#222;--paper:#fff;--bg:#fff;--muted:#5c5c5c;--faint:#999;--line:#ddd;color:#222;background:#fff}
.pdoc .page{max-width:none;padding:0;font-size:11pt}
.pdoc img{display:block}
.pcode{border-collapse:collapse;font:8.5pt/1.45 Consolas,"Cascadia Mono",monospace;color:#24292e;background:none;width:100%}
.pcode td{vertical-align:top;padding:0}.pcode .pn{color:#999;text-align:right;padding-right:10px;user-select:none;width:1%;white-space:nowrap}
.pcode .pl{white-space:pre;overflow:hidden}.pdoc.wrap .pcode .pl{white-space:pre-wrap;word-break:break-all}.pdoc.nonums .pn{display:none}
.pcode tr{break-inside:avoid}
.pdocx .docx-wrapper{background:none!important;padding:0!important}
.pdocx section.docx{box-shadow:none!important;margin:0 auto!important;break-after:page}
#printArea{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body{display:block!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
/* ⚙ Ajustes: ancho de escritorio, grupos a la izquierda, filas en tres columnas alineadas */
dialog#dlg.sets{max-width:none;width:min(1100px,calc(100vw - 32px));height:min(760px,calc(100vh - 48px));padding:0;display:none;flex-direction:column}
dialog#dlg.sets[open]{display:flex}
.sets>header,.sets>footer{display:flex;align-items:center;gap:14px;padding:12px 20px}
.sets>header{border-bottom:1px solid var(--line)}.sets>footer{border-top:1px solid var(--line)}
.sets>header b{font-size:16px;margin-right:6px}
.sfind{flex:0 1 340px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.sfind:focus{outline:2px solid var(--accent);outline-offset:-1px}
.sonly{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.scount{margin-left:auto;font-size:12px;color:var(--faint)}
.sbody{flex:1;display:grid;grid-template-columns:190px 1fr;min-height:0}
.sbody nav{padding:12px 8px;border-right:1px solid var(--line);background:var(--side);overflow:auto}
.sbody nav a{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:13px}
.sbody nav a:hover{background:var(--hover)}
.sbody nav a span{margin-left:auto;font-size:11px;color:var(--faint)}
.sbody nav a.mod::after{content:"";order:1;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sbody nav a.off{opacity:.4}
.slist{overflow:auto;padding:4px 24px 24px;scroll-padding-top:4px}
.slist h4{margin:18px 0 4px;font-size:13px;font-weight:600;color:var(--accent)}
.srow{display:grid;grid-template-columns:1fr 130px 110px 90px;gap:16px;align-items:center;padding:7px 0 7px 14px;border-bottom:1px solid var(--line);position:relative;font-size:13.5px}
.srow[hidden],.slist section[hidden]{display:none}
.srow label{cursor:pointer;line-height:1.35}
.srow label small{display:block;color:var(--faint);font-size:12px}
.srow input[type=number]{width:100%;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.srow input[type=checkbox]{justify-self:start;width:16px;height:16px;accent-color:var(--accent)}
.srow select{width:100%;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.srow input:focus-visible,.srow select:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.shint{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.sreset{visibility:hidden;font-size:12px;padding:1px 8px;justify-self:start}
.srow.mod .sreset{visibility:visible}
.srow.mod::before{content:"";position:absolute;left:2px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.snone{color:var(--muted);padding:24px 0}
.snone:empty{display:none}
.hhead{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hhead input{flex:0 1 220px}.hhead .ok{margin-left:auto;font-size:12px}
.hcols{flex:1;display:grid;grid-template-columns:minmax(260px,5fr) 6fr;min-height:0}
.hlist{overflow:auto;border-right:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:6px 14px;font-size:13px;cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--hover)}.hrow.in{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.hrow.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-left-color:var(--accent)}
.hrow .hf{color:var(--muted);font-variant-numeric:tabular-nums}.hrow .hd{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow.otra{opacity:.6}.hrow[hidden]{display:none}
.hsep{padding:6px 14px;font-size:11px;font-weight:600;color:var(--faint);background:var(--side);border-block:1px solid var(--line);position:sticky;top:0}

.hdiff .hunk{color:var(--faint)}
.himgs{display:flex;gap:12px;flex-wrap:wrap}.himgs figure{margin:0;flex:1 1 200px}.himgs img{max-width:100%;max-height:300px;border:1px solid var(--line);background:repeating-conic-gradient(#8881 0 25%,transparent 0 50%) 0 0/12px 12px}

.hfoot{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.hfoot .ok{margin-right:auto}
.fld{display:grid;gap:4px;margin:10px 0;font-size:13px;color:var(--muted)}
.fld input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.frow{display:flex;gap:8px;align-items:center;padding:3px 0}
#tFiles{margin:12px 0}
#tPrev{max-height:220px;overflow:auto;background:var(--bg);padding:10px;border-radius:6px;font-size:12px;white-space:pre-wrap}
dialog::backdrop{background:rgba(0,0,0,.35)}
/* explorador para añadir */
#exp{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10}
#exp[hidden]{display:none}
.exp-box{width:min(1100px,calc(100vw - 32px));height:min(720px,calc(100vh - 32px));display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);background:var(--paper);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden}

#crumbs span{color:var(--muted)}
#expFind{flex:0 1 280px;font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#expFind:focus,#expList:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* tres columnas: dónde buscar | qué hay | qué se va a añadir */
.exp-body{display:grid;grid-template-columns:190px minmax(0,1fr) 300px;min-height:0}

@media (max-width:620px){.exp-body{grid-template-columns:1fr;grid-template-rows:1fr auto}#expSide{border-left:0;border-top:1px solid var(--line);max-height:40vh}}

#expList{overflow:auto;padding:0 6px 6px;outline:none}
.exp-nav{flex-wrap:nowrap}
#crumbs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;min-width:0}#crumbs>*{flex:none;white-space:nowrap}
.ehead,.erow{display:grid;grid-template-columns:18px 22px minmax(0,1fr) 110px 90px;gap:8px;align-items:center;padding:4px 8px}
.ehead{position:sticky;top:0;background:var(--paper);font-size:12px;color:var(--faint);border-bottom:1px solid var(--line);margin-bottom:2px;z-index:1}

.erow input{margin:0;accent-color:var(--accent)}
.et,.es{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es i{font-style:normal;color:var(--accent)}
#expSide{border-left:1px solid var(--line);overflow:auto;padding:4px 16px 16px;font-size:13px;line-height:1.5}

#expSide .path{font-weight:600;word-break:break-all}

#expSide button{margin-top:8px}
.efiles{list-style:none;margin:4px 0;padding:0;max-height:220px;overflow:auto}

<main>

  <div class="convtop"><button id="convLink" class="clink"><span></span></button><select id="convSel" title="Conversaciones guardadas"></select><button id="convNew" title="Empezar otra conversación (la actual queda en el desplegable)">Nueva</button><button id="convDel" class="ic" title="Borrar esta conversación"></button></div>
  <div id="convLog"></div>
  <div class="iaask">
    <div id="ctx"></div>

    <div class="exp-nav"><button id="expUp" title="Subir un nivel (Retroceso)">↑</button><div id="crumbs"></div>
      <input type="search" id="expFind" placeholder="Filtrar esta carpeta…" aria-label="Filtrar esta carpeta"></div>
    <div class="exp-body"><nav id="expPlaces"></nav><div id="expList" tabindex="0"></div><div id="expSide"></div></div>
    <footer><span class="ok">Doble clic o Enter: entrar · Retroceso: subir · Espacio: marcar · Escribir: filtrar</span>
      <div class="exp-actions"><button id="expCancel">Cancelar</button></div></footer>
  </div>
</div>
<script>
// Vista dividida: los dos lados repiten ids (#tabs, #bar, #view, #rpg…); $() busca primero en el lado activo.
let paneEl = document.querySelector('.pane');
const $ = s => paneEl.querySelector(s) || document.querySelector(s);
const H = { 'X-Atril': '1' };
const api = (url, body) => fetch(url, body === undefined ? { headers: H } :
  { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  .then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.error); return d; });
const sepOf = p => /^[A-Za-z]:|^\\\\/.test(p) ? '\\' : '/'; // C:\… o \\servidor → \ ; /home/… → /
const pjoin = (dir, name) => dir.replace(/[\\/]+$/, '') + sepOf(dir) + name;
const under = (path, dir) => { // ¿path está dentro de dir (o es dir)? sin distinguir mayúsculas ni separador
  const a = path.toLowerCase(), d = dir.toLowerCase().replace(/[\\/]+$/, '');
  return a === d || a.startsWith(d + '\\') || a.startsWith(d + '/');
};
const rawPath = u => { const r = u.split('/').map(decodeURIComponent); return r.join(sepOf(r[0]) === '\\' ? '\\' : '/'); }; // /raw/… → ruta
const raw = p => '/raw/' + p.split(/[\\/]/).map(encodeURIComponent).join('/');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const set = s => new Set(s.split(' '));

// ---------- iconos (trazos simples, 24×24) ----------
const I = {
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',

  sparkles: '<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>',
  settings: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',

  filePlus: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',
  collapse: '<path d="m7 20 5-5 5 5M7 4l5 5 5-5"/>',

  split: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
  unsplit: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16" stroke-dasharray="2 3"/>',
  left: '<path d="M19 12H5M11 18l-6-6 6-6"/>',
  right: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  book: '<path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/>',
  pencil: '<path d="M17 3l4 4L8 20H4v-4z"/>',
  more: '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  panelLeft: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  panelRight: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  max: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',

  lines: '<path d="M4 6h16M4 10h16M4 14h12M4 18h9"/>',
  file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>',
  link: '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
};
const svg = name => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[name]}</svg>`;
// Botón de icono (SVG de I) con su texto de ayuda también como aria-label, para lectores de pantalla.
function iconBtn(name, title, fn, disabled = false) {
  const b = button('', fn);
  b.className = 'ic'; b.title = title; b.disabled = disabled; b.setAttribute('aria-label', title);
  b.innerHTML = svg(name);
  return b;
}

// ---------- tipos (ver formatos_atril.md) ----------
const IMG = set('jpg jpeg jpe png gif bmp dib webp avif ico svg'), AUD = set('mp3 wav flac aac m4a ogg oga opus'),
  VID = set('mp4 m4v webm ogv mov'), FONT = set('ttf otf woff woff2'), MD = set('md markdown mdx rmd'),
  HTML = set('html htm xhtml'), TABLE = { csv: ',', tsv: '\t', psv: '|' },
  LOCK = set('env pem key asc crt cer csr p12 pfx gpg pgp der p7b p7c ppk jks keystore kdbx ovpn'),
  LOCK_NAMES = set('.npmrc .pypirc .netrc .htpasswd .git-credentials id_rsa id_dsa id_ecdsa id_ed25519 credentials credentials.json secrets.json secrets.yml secrets.yaml wp-config.php auth.json service-account.json .dockercfg');
const LANG = { phtml: 'php', php3: 'php', php4: 'php', php5: 'php', pyw: 'python', pyx: 'python', ps1: 'powershell',
  psm1: 'powershell', psd1: 'powershell', bat: 'dos', cmd: 'dos', sh: 'bash', zsh: 'bash', fish: 'bash', mjs: 'javascript',
  cjs: 'javascript', jsx: 'javascript', tsx: 'typescript', vue: 'xml', svelte: 'xml', astro: 'xml', xhtml: 'xml',
  xsd: 'xml', xsl: 'xml', xslt: 'xml', svg: 'xml', kml: 'xml', gpx: 'xml', ovf: 'xml', yml: 'yaml', jsonc: 'json',
  json5: 'json', ipynb: 'json', geojson: 'json', cfg: 'ini', conf: 'ini', properties: 'ini', env: 'ini', toml: 'ini',
  editorconfig: 'ini', gitattributes: 'ini', gitignore: 'bash', md: 'markdown', markdown: 'markdown', mdx: 'markdown',
  rmd: 'markdown', csx: 'csharp', cs: 'csharp', vb: 'vbnet', vbs: 'vbscript', bas: 'vbscript', cls: 'vbscript',
  frm: 'vbscript', vba: 'vbscript', rs: 'rust', rb: 'ruby', rake: 'ruby', pl: 'perl', pm: 'perl', kt: 'kotlin',
  kts: 'kotlin', h: 'cpp', hh: 'cpp', hpp: 'cpp', cc: 'cpp', cxx: 'cpp', fs: 'fsharp', fsx: 'fsharp', fsi: 'fsharp',
  hs: 'haskell', lhs: 'haskell', ex: 'elixir', exs: 'elixir', erl: 'erlang', hrl: 'erlang', clj: 'clojure',
  cljs: 'clojure', m: 'matlab', mm: 'objectivec', jl: 'julia', sc: 'scala', gradle: 'groovy', tex: 'latex', bib: 'latex',
  proto: 'protobuf', asm: 'x86asm', s: 'x86asm', ino: 'arduino', psql: 'sql', pgsql: 'sql', mk: 'makefile',
  cmake: 'cmake', gql: 'graphql', tf: 'ini', hcl: 'ini', patch: 'diff', log: 'plaintext', txt: 'plaintext', text: 'plaintext' };

// Tipo de un archivo por su nombre: extensión, lenguaje para colorear el código y si es sensible (🔒).
function kind(name) {
  const lower = name.toLowerCase(), ext = lower.includes('.') ? lower.split('.').pop() : '';
  const lang = lower.endsWith('.blade.php') ? 'xml' : lower === 'makefile' ? 'makefile' : lower === 'dockerfile' ? 'dockerfile'
    : LANG[ext] || ext;
  return { ext, lang, lock: LOCK.has(ext) || LOCK_NAMES.has(lower) || lower.startsWith('.env') };
}

// ---------- barra lateral ----------
const tree = new Map(); // ruta → ¿abierta?
let side = { proyectos: [], sueltos: [] };
// Árbol de la barra lateral: proyectos (con sus avisos: sin reglas, sin bitácora…) y archivos sueltos.
// Las carpetas que estaban abiertas (mapa `tree`) se vuelven a desplegar antes de marcar el archivo actual.
async function loadSide() {
  const st = side = await api('/api/estado');
  const P = $('#projects'); P.innerHTML = '';
  if (!st.proyectos.length) P.innerHTML = '<p class="ok" style="margin:0 8px">Pulsa + para añadir una carpeta.</p>';
  const pending = [];
  for (const p of st.proyectos) {
    const box = document.createElement('div'); box.className = 'proj';
    box.append(nodeEl(p.nombre, p.ruta, true, p.ruta));
    const b = document.createElement('div'); b.className = 'badges';
    if (!p.avisos.length) b.innerHTML = '<span class="ok">✅ En orden</span>';
    for (const a of p.avisos) {
      const s = button((a === 'Bitácora grande' ? '🟡 ' : '⚠️ ') + a, () =>
        a === 'Bitácora grande' ? archiveDialog(p) : a === 'No encontrado' ? removeMissing(p) : templateDialog(p));
      s.className = 'badge'; b.append(s);
    }
    box.append(b, Object.assign(document.createElement('div'), { className: 'kids' }));
    P.append(box);
    if (tree.get(p.ruta)) pending.push(expand(box.querySelector('.node')));
  }
  const L = $('#loose'); L.innerHTML = '';
  if (!st.sueltos.length) L.innerHTML = '<p class="ok" style="margin:0 8px">Pulsa + o arrastra archivos a la ventana.</p>';
  for (const s of st.sueltos) {
    const el = nodeEl(s.nombre, s.ruta, false, s.ruta, s.git);
    if (!s.existe) { el.classList.add('missing'); el.title = 'Ya no existe: ' + s.ruta; }
    L.append(el);
  }
  await Promise.all(pending); // espera también las carpetas desplegadas (para poder llegar al archivo abierto)
  markActive();
}

// nombre largo… .docx: se recorta el nombre, nunca la extensión
function setName(el, name, file = true, before = '', after = '') {
  const m = file && name.match(/^(.+?)(\.[^.\s]{1,8})$/);
  el.classList.add('nm'); el.textContent = '';
  el.append(Object.assign(document.createElement('span'), { className: 'b', textContent: before + (m ? m[1] : name) }));
  if (m || after) el.append(Object.assign(document.createElement('span'), { className: 'e', textContent: (m ? m[2] : '') + after }));
}
const GIT_TXT = { limpio: 'Git: sin cambios', modificado: 'Git: modificado', nuevo: 'Git: nuevo (sin commit)',
  conflicto: 'Git: conflicto', ignorado: 'Git: ignorado (.gitignore)', sin_git: 'No está en git' };
// Una fila del árbol: nombre (con la extensión siempre visible), 🔒 si es sensible, punto de git que
// cambia a (i) al pasar el ratón y ⋮/✕ para proyectos y sueltos. Clic: abrir · doble clic: fijar · arrastrar: al chat.
function nodeEl(name, path, isDir, removable, git) {
  const el = document.createElement('div');
  const k = kind(name);
  el.className = 'node' + (isDir && tree.get(path) ? ' open' : ''); el.dataset.path = path; el.title = path;
  el.innerHTML = `<span class="chev">${isDir ? '›' : ''}</span><span class="n"></span>` +
    (k.lock && !isDir ? '<span title="Archivo sensible">🔒</span>' : '') +
    // archivos: punto con el estado de git; al pasar el ratón se cambia por (i) = información
    (!isDir ? `<span class="gd" data-g="${git || 'sin_git'}" title="${GIT_TXT[git || 'sin_git']}"></span><button class="ib" title="Información del archivo">i</button>` : '') +
    (removable ? (isDir ? '<span class="x" title="Opciones del proyecto">⋮</span>' : '<span class="x" title="Quitar de Atril">✕</span>') : '');
  setName(el.querySelector('.n'), name, !isDir);
  if (k.lock && !isDir) el.classList.add('lock');
  if (!isDir && /\.bak$/i.test(name)) el.classList.add('bak');
  const remove = async () => await ask('Quitar de Atril', `¿Quitar «${name}» de Atril?\nNo se borra nada del disco.`, ['Quitar', 'Cancelar'], { danger: true }) === 'Quitar' && api('/api/quitar', { ruta: removable }).then(loadSide);
  el.oncontextmenu = e => { e.preventDefault(); nodeMenu({ x: e.clientX, y: e.clientY }, path, isDir, git); };
  el.onclick = e => {
    if (e.target.classList.contains('ib')) return nodeMenu(e.target, path, isDir, git);
    if (e.target.classList.contains('x')) {
      if (!isDir) return remove();
      const o = sortOf(path), setSort = m => { const all = sortMap(); all[path] = m; LS('atril.orden', JSON.stringify(all)); loadSide(); };
      return openMenu(e.target, [['Nuevo archivo aquí', () => newInline('archivo', path)], ['Nueva carpeta aquí', () => newInline('carpeta', path)],
        ['Ejecutar pruebas', () => runTests(path, name)],
        ['Mostrar en carpeta', () => api('/api/mostrar', { ruta: path })], ['Quitar de Atril', remove],
        '-', { head: 'Ordenar (carpetas primero)' },
        sortRow('Alfabético', 'alfa', o, setSort, 'asc', [['asc', '↑', 'Ascendente: de la A a la Z'], ['desc', '↓', 'Descendente: de la Z a la A']]),
        sortRow('Fecha modificación', 'fecha', o, setSort, 'desc', [['asc', '↑', 'Ascendente: lo más antiguo primero'], ['desc', '↓', 'Descendente: lo más reciente primero']])]);
    }
    if (isDir) { selDir = path; markActive(); return toggle(el); } // la carpeta elegida recibe lo nuevo
    openTab(path);
  };
  if (!isDir) {
    el.ondblclick = e => !e.target.classList.contains('ib') && openTab(path, true); // doble clic: pestaña fija
    el.draggable = true; // arrastrar al chat = adjuntar
    el.ondragstart = e => { e.dataTransfer.setData('text/atril-path', path); e.dataTransfer.effectAllowed = 'copy'; };
  }
  return el;
}

// (i) y clic derecho: acciones del archivo o carpeta; las de copiar dicen en el título qué se copia
function relPath(path) { // al proyecto, o el nombre si es suelto
  const p = side.proyectos.find(x => under(path, x.ruta));
  return p ? path.slice(p.ruta.replace(/[\\/]$/, '').length + 1) : path.split(/[\\/]/).pop();
}
// git: estado conocido (árbol) o null si no se sabe (pestaña: se mira en el árbol si está a la vista); extra: opciones de la pestaña
function nodeMenu(anchor, path, isDir, git, extra = []) {
  const name = path.split(/[\\/]/).pop() || path, rel = relPath(path);
  const g = git ?? document.querySelector(`aside .node[data-path="${CSS.escape(path)}"] .gd`)?.dataset.g ?? null;
  const copy = [['⧉  Copiar nombre', () => copyText(name, 'Nombre copiado'), { title: name }],
    ['⧉  Copiar ruta', () => copyText(path, 'Ruta copiada'), { title: path }],
    ['⧉  Copiar ruta relativa', () => copyText(rel, 'Ruta relativa copiada'), { title: rel }],
    ['📁  Mostrar en carpeta', () => api('/api/mostrar', { ruta: path }).catch(e => ask('Mostrar en carpeta', e.message, ['Entendido'])), { title: 'Abrir el explorador de archivos con el archivo marcado' }]];
  if (isDir) return openMenu(anchor, [{ head: name }, ['ⓘ  Información…', () => infoDialog(path)], '-',
    ['＋  Nuevo archivo aquí', () => newInline('archivo', path)], ['＋  Nueva carpeta aquí', () => newInline('carpeta', path)], '-', ...copy]);
  openMenu(anchor, [{ head: g ? `${name} · ${GIT_TXT[g]}` : name }, ...extra,
    ['ⓘ  Información…', () => infoDialog(path)],
    ['⇆  Comparar versiones (git)…', () => compareDialog(path), g === 'sin_git' ? { disabled: true, title: 'Sin git: este archivo no está en un repositorio' } : { title: 'Ver y comparar sus commits en 2 o 3 columnas' }],
    ['⇆  Comparar con otro archivo…', () => comparePick(anchor, path), { title: 'Elegir otro archivo y ver sus diferencias en colores' }],
    ...(otherPath() && otherPath() !== path ? [['⇆  Comparar con el otro lado', () => compareFiles(path, otherPath()), { title: otherPath() }]] : []),
    '-',
    ['📄  Abrir', () => openTab(path, true)],
    ['✎  Editar', () => editPath(path)],
    ['📎  Adjuntar al chat', () => { setIA(true); dropPath(path); }, { title: 'Lo mismo que arrastrarlo al panel de IA' }],
    ['🖨  Imprimir…', () => printDialog(path), canPrint(path) ? { key: 'Ctrl+P' } : { disabled: true, title: 'Audio, vídeo y fuentes no se imprimen' }],
    '-', ...copy]);
}
// ---------- pestaña web ----------
// Un <iframe> con sandbox sin allow-top-navigation: la web no puede sacar a Atril de su página.
// Antes de cargar, /api/web/permite mira X-Frame-Options y frame-ancestors; si la web no se deja mostrar,
// se ofrece abrirla en el navegador. La dirección no sigue a los enlaces dentro de la web (el iframe es de otro
// origen y no se puede leer); ← → usan el historial de la ventana, contando solo las cargas de este iframe.
// buscador de ⚙ Ajustes (web_buscador); igu=1: con ese parámetro Google se deja mostrar en un iframe
const SEARCHERS = { google: 'https://www.google.com/search?igu=1&q=', bing: 'https://www.bing.com/search?q=',

// 📁 Explorador · 🔍 Buscar; clic en la vista que ya se ve = ocultar la barra (como VS Code)
function sideView(v, keep) {

// Resultados: proyecto › archivo › fragmentos. Un archivo sale una vez aunque coincida por nombre y por contenido.
let sres = null, sfilt = '', sfold = new Set();
// Búsqueda en el índice (nombres y contenido) con las opciones del buscador; descarta la respuesta si ya se escribió otra cosa.
async function sideSearch() {
  const q = $('#sideQ').value.trim();
  if (!q) { sres = null; return drawResults(); }
  const qs = `q=${encodeURIComponent(q)}&nombre=${+sopt.nombre}&contenido=${+sopt.contenido}&exacto=${+sopt.exacto}`;
  const r = await api('/api/buscar?' + qs).catch(e => ({ nombres: [], contenido: [], error: e.message }));
  if (q !== $('#sideQ').value.trim()) return; // ya se escribió otra cosa
  const files = new Map(), get = x => files.get(x.ruta) || files.set(x.ruta, { ...x, hits: [], byName: false }).get(x.ruta);
  r.nombres.forEach(x => get(x).byName = true);
  r.contenido.forEach(x => get(x).hits.push(x));
  if (sres?.q !== q) sfold = new Set();
  sres = { q, files: [...files.values()], error: r.error };
  if (!sres.files.some(f => kind(f.nombre).ext === sfilt)) sfilt = '';
  drawResults();
}
// Resultados del buscador lateral agrupados por proyecto, con chips por tipo de archivo para filtrar y el total de coincidencias.
function drawResults() {
  const R = $('#results'), C = $('#schips');
  R.innerHTML = C.innerHTML = $('#sinfo').textContent = '';
  if (!sres) return R.innerHTML = '<p class="sempty">Escribe para buscar en los nombres y dentro de los archivos de tus proyectos.<br>"Entre comillas" busca la frase exacta.</p>';
  const all = sres.files, n = all.reduce((a, f) => a + f.hits.length, 0);
  if (!all.length) return R.innerHTML = `<p class="sempty">${esc(sres.error || 'Sin resultados.')}${idxInfo?.fase === 'indexando' ? ' El índice aún se está creando.' : ''}</p>`;
  $('#sinfo').textContent = `${all.length} archivo${all.length === 1 ? '' : 's'}` + (n ? ` · ${n} fragmento${n === 1 ? '' : 's'}` : '');
  // chips por extensión (solo si hay más de un tipo)
  const exts = new Map(); all.forEach(f => { const e = kind(f.nombre).ext || '(sin)'; exts.set(e, (exts.get(e) || 0) + 1); });
  if (exts.size > 1) for (const [e, k] of [['', all.length], ...[...exts].sort((a, b) => b[1] - a[1])]) {
    const b = button('', () => { sfilt = sfilt === e ? '' : e; drawResults(); });
    b.innerHTML = `${esc(e || 'Todos')}<b>${k}</b>`; b.className = sfilt === e ? 'on' : '';
    b.title = e ? `Ver solo .${e}` : 'Ver todos los tipos';
    C.append(b);
  }
  const shown = sfilt ? all.filter(f => (kind(f.nombre).ext || '(sin)') === sfilt) : all;
  const projs = new Map(); shown.forEach(f => (projs.get(f.raiz) || projs.set(f.raiz, []).get(f.raiz)).push(f));
  for (const [raiz, list] of projs) {
    const P = document.createElement('div'); P.className = 'sproj' + (sfold.has(raiz) ? ' fold' : '');
    const h = rowEl(raiz.split(/[\\/]/).filter(Boolean).pop(), list.length, raiz);
    h.onclick = () => { foldKey(raiz); P.classList.toggle('fold'); syncFold(); };
    const K = document.createElement('div'); K.className = 'spk';
    list.forEach(f => K.append(fileResult(f)));
    P.append(h, K); R.append(P);
  }
  markActive();
}
const foldKey = k => sfold.has(k) ? sfold.delete(k) : sfold.add(k);
function rowEl(name, count, title) { // fila plegable de proyecto
  const el = document.createElement('div'); el.className = 'node sr'; el.tabIndex = -1; el.title = title;
  el.innerHTML = `<span class="chev">›</span><span class="n"></span><span class="cnt">${count}</span>`;
  el.querySelector('.n').textContent = name;
  return el;
}
// Un archivo en los resultados: nombre, carpeta, número de coincidencias, «nombre» si coincide por el nombre y,
// desplegados, los fragmentos; clic en un fragmento: abre el archivo con esa palabra en el buscador (y en su página, si es PDF).
function fileResult(f) {
  const F = document.createElement('div'); F.className = 'sfile' + (sfold.has(f.ruta) ? ' fold' : '');
  const el = document.createElement('div'); el.className = 'node res sr'; el.tabIndex = -1; el.dataset.path = f.ruta; el.title = f.ruta;
  const rel = f.ruta.slice(f.raiz.length).replace(/^[\\/]/, ''), folder = rel.replace(/[\\/]?[^\\/]*$/, '');
  el.innerHTML = `<span class="chev">${f.hits.length ? '›' : ''}</span><div class="rb"><span class="n"></span></div>` +
    (f.hits.length > 1 ? `<span class="cnt">${f.hits.length}</span>` : '') + (f.byName ? '<span class="stag" title="Coincide en el nombre del archivo">nombre</span>' : '');
  setName(el.querySelector('.n'), f.nombre || rel); // la extensión siempre a la vista, como en el Explorador
  if (folder) el.querySelector('.rb').append(Object.assign(document.createElement('small'), { textContent: folder }));
  el.onclick = e => {
    if (e.target.classList.contains('chev') && f.hits.length) { foldKey(f.ruta); F.classList.toggle('fold'); return syncFold(); }
    openHit(f, f.hits[0]);
  };
  el.ondblclick = () => openTab(f.ruta, true);
  el.oncontextmenu = e => { e.preventDefault(); nodeMenu({ x: e.clientX, y: e.clientY }, f.ruta, false); };
  F.append(el);
  if (f.hits.length) {
    const H = document.createElement('div'); H.className = 'shits';
    for (const x of f.hits) {
      const r = document.createElement('div'); r.className = 'shit sr'; r.tabIndex = -1;
      r.innerHTML = (x.pagina ? `<span class="pg">pág. ${x.pagina}</span>` : '') +
        `<span class="sn">${esc(x.fragmento.replace(/\s+/g, ' ')).replace(/\[\[/g, '<mark>').replace(/\]\]/g, '</mark>')}</span>`;
      r.onclick = () => openHit(f, x);
      r.ondblclick = () => openTab(f.ruta, true);
      H.append(r);
    }
    F.append(H);
  }
  return F;
}
// Abre el archivo y deja el buscador de la pestaña en lo encontrado (en un PDF, desde esa página)
function openHit(f, x) {
  const word = x?.fragmento.match(/\[\[(.+?)\]\]/)?.[1];
  if (x?.pagina) pdfPage.set(f.ruta, x.pagina);
  if (word) findSt.set(f.ruta, { r: '', ...findSt.get(f.ruta), q: word, c: sopt.exacto, a: !sopt.exacto, w: false, x: false, open: true });
  openTab(f.ruta);
}
$('#results').onkeydown = e => { // ↑↓ recorrer · Enter abrir · ← → plegar
  const rows = [...$('#results').querySelectorAll('.sr')].filter(r => r.offsetParent), i = rows.indexOf(document.activeElement);
  if (i < 0) return;
  const row = rows[i], box = row.parentElement, foldable = box.classList.contains('sproj') || (box.classList.contains('sfile') && box.querySelector('.shits'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); (rows[i + (e.key === 'ArrowDown' ? 1 : -1)] || (e.key === 'ArrowUp' ? $('#sideQ') : row)).focus(); }
  else if (e.key === 'Enter') { e.preventDefault(); row.click(); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && foldable && box.classList.contains('fold') === (e.key === 'ArrowRight')) {
    e.preventDefault(); foldKey(box.classList.contains('sproj') ? row.title : row.dataset.path); box.classList.toggle('fold'); syncFold();
  }
};
